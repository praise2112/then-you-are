[project]
name = "oddstage"
version = "0.1.0"
description = "Oddstage: a judged creative-game arena. First game: Then I Am."
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.8.0",
    "better-profanity>=0.7.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "langfuse>=4.16.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "asgi-lifespan>=2.1.0",
    "b2sdk==2.13.0",
    "httpx>=0.27",
    "markdown>=3.7",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena_core", "arena_judge", "arena_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["arena_core", "arena_evals", "arena_judge", "arena_server", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 --dist loadgroup"
