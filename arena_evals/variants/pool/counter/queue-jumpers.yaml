- previous_move: Outside the chemist, the queue is Priya, a delivery driver, a parent with a sleeping
    baby, Len, and Rob.
  move: Rob moves to the front because he has been waiting longer in spirit.
  gates_note: satisfies_criterion false, vague personal claim and no fair public need
  mechanism: none, impatience has been dressed as philosophy
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 0
  confidence: clear
  verdict: fail
- previous_move: Outside the bakery, the queue is Erin, a wheelchair user, three students, a florist,
    and Mo.
  move: The wheelchair user and the florist move together to the front because the morning feels urgent.
  gates_note: satisfies_criterion false, two people move and the reason is vague
  mechanism: none, the queue has been given a group hug instead of a rule
  scores:
