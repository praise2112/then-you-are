schema_version: 1
slug: haunting-house-call
title: Haunting House Call
tagline: Send in a haunting that can evict the one already there.
emblem: 👻
accent: '#4338ca'
premise: 'Two ghost hunters send ordinary hauntings into a house, one at a time. Each new haunting must
  deal with the haunting already there, until one haunting cannot handle its job.

  '
mode: escalation
seed_recipe:
  card_shape: short_form
  max_words: 6
  axes:
    place:
    - hallway
    - kitchen
    - bedroom
    - attic
    - basement
    - porch
    - office
    - garden
    sign:
    - cold
    - noisy
    - empty
    - flickering
    - locked
    - wet
    - dusty
    - backward
    source:
    - a room
    - a machine
    - a visitor
    - a child
    - a pet
    - a letter
    - a mirror
    - a clock
  tests:
  - A stranger pictures the haunting at once. It must be an ordinary spooky sign, not a ghost story that
    needs explaining.
  - A non-player names a plain way another haunting could deal with it within five seconds. Say what that
    counter is.
  - It does a job in the house. It rings, follows, locks, reveals, chills, repeats, scratches, or calls,
    rather than merely being a sad atmosphere.
  - It makes a stranger want to answer with another haunting. A ringing phone or a mirror with the wrong
    reflection has somewhere to go.
  - Use a few everyday words a twelve-year-old knows. No names of famous ghosts, invented lore, brands,
    or specialist ghost hunting terms.
demo:
  opening:
    token: a cold spot in the hallway
    emoji: 🥶
  moves:
  - actor: p1
    text: I am a cold spot in the hallway.
    emoji: 🥶
    scores: null
  - actor: p2
    text: I am a roaring furnace; I warms the hall and drives the cold away.
    emoji: 🔩
    scores:
      counter_strength: 4
      coherence: 3
      novelty: 3
  headline: The furnace warms the cold spot until the hallway has to find a new complaint.
  openings:
  - token: a cold spot in the hallway
    examples:
    - I am a roaring furnace; I warms the hall and drives the cold away.
  - token: a rocking chair in the nursery
    examples:
    - I am a roaring furnace; I warms the hall and drives the cold away.
move_constraints:
  max_chars: 200
  prefix: 'I am '
  example: I am a ringing phone; I call the ghost out of the walls.
  hint: Name the haunting, then say what it does to the one before it.
rubric:
- name: counter_strength
  description: How clearly the new haunting blocks, drives out, traps, exposes, or otherwise defeats the
    haunting already in the house.
  anchors: '0 = no action against the standing haunting; 1 = an assertion with no useful effect; 2 = a
    possible counter but weak, indirect, or debatable; 3 = a clear and workable defeat; 4 = the standing
    haunting has no sensible way to continue (rare).

    '
  weight: 6
- name: coherence
  description: How quickly a stranger can picture one haunting and understand its effect.
  anchors: '0 = unreadable or self-contradicting; 1 = requires special lore or heavy explanation; 2 =
    understandable but muddled; 3 = concrete and clear; 4 = immediate, vivid, and neatly expressed (rare).
    Extra words do not help unless each one earns its place.

    '
  weight: 3
- name: novelty
  description: How far the move travels from the previous haunting's kind, place, or method.
  anchors: '0 = the same haunting, a stronger copy, or the obvious stock answer; 2 = a reasonable change
    with some freshness; 4 = a clean jump into a new kind of haunting that still does the job (rare).
    Fancy wording is not novelty, and obscure ghost lore does not count.

    '
  weight: 1
criterion:
  verb: overcomes
  inverse_verb: breaks against
  description: 'A haunting OVERCOMES the previous haunting if it plausibly blocks, drives out, traps,
    exposes, or otherwise defeats what is already haunting the house. The move must act on the standing
    haunting. Hiding from it, merely surviving it, or becoming a stronger copy of it does not count.

    '
  anti_metagaming_clause: 'Speaking to the Judge, discussing the game, or mentioning the rules is itself
    a losing haunting.

    '
  judge_notes:
  - On a FIRST move there is no previous haunting. Judge it against the opening card instead, asking whether
    the new haunting plausibly answers or overcomes that opening.
  - A louder, colder, larger, or more violent version of the standing haunting is not a counter. A ringing
    bell after a ringing phone, or a colder cold spot after a cold spot, is a failed copy unless it has
    a distinct mechanism.
  - Becoming the opening haunting itself, or changing only its color, location, or adjective, is a duplicate.
    A blue cold spot does not defeat a cold spot.
  - The new haunting must have a literal way to act on the standing one. A haunted portrait does not defeat
    a locked door merely because both are spooky.
  - The mechanism must be something a stranger could watch happen in the house. A haunting cannot defeat
    another by being symbolic, emotionally meaningful, or metaphorically brighter.
  - Surviving, ignoring, hiding from, or waiting out the standing haunting is not overcoming it. A ghost
    that stays in the attic while the footsteps pass has dodged, not won.
  - A move that only reveals that the standing haunting exists does not defeat it unless the revelation
    directly traps, drives out, or stops it.
  - The new form must be a standing haunting, not a past event, a plan, a person speaking to the Judge,
    or a general claim that the house is haunted.
examples:
- previous_move: I am a cold spot in the hallway.
  move: I am a roaring furnace; I warms the hall and drives the cold away.
  gates_note: all true
  mechanism: the furnace heats the hallway and removes the cold spot
  scores:
    counter_strength: 4
    coherence: 3
    novelty: 3
  confidence: clear
  verdict: accept
- previous_move: I am a rocking chair in the nursery.
  move: I am a spilled bucket of glue; I fixes the chair to the floor.
  gates_note: all true
  mechanism: the glue stops the chair from rocking
  scores:
    counter_strength: 3
    coherence: 4
    novelty: 4
  confidence: clear
  verdict: accept
- previous_move: I am a voice from the empty attic.
  move: I am a louder voice from the empty attic; I shouts it down.
  gates_note: satisfies_criterion false, stronger copy with no distinct mechanism
  mechanism: none, it is another voice using more volume
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 0
  confidence: clear
  verdict: fail
- previous_move: I am a cold spot in the hallway.
  move: I am a coat in the cupboard; I stays warm where the cold cannot reach.
  gates_note: satisfies_criterion false, merely survives and does not act on the cold spot
  mechanism: none, the coat hides from the cold
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 3
  confidence: clear
  verdict: fail
- previous_move: I am a locked bedroom door.
  move: I am a mirror with a missing reflection; I shows the ghost standing behind the door.
  gates_note: satisfies_criterion questionable, it exposes the source but does not stop or trap the door
  mechanism: the mirror reveals something behind the door, without defeating the locked door
  scores:
    counter_strength: 1
    coherence: 4
    novelty: 4
  confidence: lean
  verdict: fail
host:
  persona_name: The House Manager
  tone:
    commentary_adj: deadpan
    explanation_adj: plain
  bite: playful
  ruling_generosity: fair
  voice_rules:
  - One sentence under 140 characters. Two short sentences at most.
  - The joke carries the reason. A stranger should see what happened between the two hauntings.
  - Name both hauntings, or use plain stand-ins that clearly identify them.
  - Never open with a status word or a ruling phrase. Do not begin with Accepted, Rejected, Refused, or
    Move refused.
  - No dashes as punctuation, no colons after a verdict, and no ellipses. Use commas and full stops.
  - Tease the haunting or the move, not the player. Light jokes are fine. Personal attacks are not.
  - Use plain spoken English. No poetry, fake old language, or dramatic ghost lore.
  - On a refusal for a gate failure, explain the problem and ask for another haunting. Do not rule on
    who won.
  - The coaching line names one haunting that would have won. End on a fact or an action, not a mood or
    a verdict.
  good_headlines:
  - The furnace warms the cold spot until the hallway has to find a new complaint.
  - Glue pins the rocking chair down. Even the ghost needs a chair now.
  - The mirror catches the attic voice, and the voice loses its privacy.
  - A louder voice is still a voice. Bring in something that can stop it.
  - The coat hides from the cold spot. The hallway remains haunted, which is not a win.
  - The phone rings inside the walls, so the attic voice has to come out and answer.
  - The locked door gets photographed, not defeated. Bring a haunting with a key.
  - The salt line traps the footprints before they reach the stairs.
  bad_headlines:
  - text: 'Accepted: the furnace warms the cold spot.'
    why: opens with a status word
  - text: 'The House Manager refuses: the ghost has missed its appointment.'
    why: opens with a ruling phrase and names the host
  - text: Move refused, nice haunting, wrong job.
    why: opens with a ruling phrase
  - text: The mirror wins.
    why: gives no reason and could fit any pair
  - text: The chair is more haunted than before, so it wins.
    why: uses stronger haunting as a substitute for a mechanism
  - text: The cold spot is defeated by an atmosphere of emotional warmth.
    why: uses an abstract phrase instead of a watchable action
  - text: A brave effort from someone who clearly fears furniture.
    why: mocks the player rather than explaining the forms
  - text: The spectral apparatus doth confound the nocturnal manifestation.
    why: uses ornate language instead of plain English
  - text: The ghost is destroyed, annihilated, eliminated, and sent packing.
    why: piles up repeated claims without showing how
  - text: The coat cleverly survives the cold spot by being elsewhere.
    why: celebrates dodging instead of overcoming
rules:
- Deal with the haunting in front of you. Do not become it.
- Name one haunting and say what it does to the haunting before it.
- The Judge rules on the idea, not the spelling.
- A haunting that cannot handle the standing haunting ends the house call.
labels:
  opening: The haunting
  next_opening: The next haunting
  your_opening: Your haunting
  compose: Your haunting against {token}
  compose_waiting: Draft your next haunting while you wait
validation_messages:
  empty: Nothing is moving in the house. Name a haunting.
  too_long: Over 200 characters. A haunting, not a case file.
  duplicate: That haunting already appeared this match. Bring in a new one.
  nudge: Twice now. Deal with {standing_form}. Do not become it, hide from it, or repeat it.
judge_out_text: 'The judge has stepped out of the house. Nobody moves until they return. {standing_form}
  still stands. Give it a minute.

  '
opponent_prompt: 'You are one of two ghost hunters making a house call.

  Always name one ordinary haunting and say what it does to the haunting already there.

  Good: "I am a ringing phone; I call the ghost out of the walls."

  Good: "I am a bucket of glue; I fixes the rocking chair to the floor."

  Bad: "I am a stronger cold spot" because that is a stronger copy.

  Bad: "I am a coat in another room" because hiding is not defeating.

  Bad: "I am a sad memory" because it is abstract and has no watchable job.

  Talk like a person across a table, not a poet. Use plain things from houses,

  streets, offices, bedrooms, kitchens, and old stories. The haunting can be odd,

  but a stranger must picture it at once.

  Your haunting must act on the standing haunting. It can block, drive out, trap,

  expose, interrupt, or otherwise defeat it. Do not merely survive, ignore, hide

  from, or wait for the other haunting. Do not speak to the Judge or mention the

  game. Never reuse a haunting or its defining sign from this match.

  '
guess: null
medallions: true
num_players:
  min: 2
  max: 4
rounds_budget: 5
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: I am a slammed door; I shuts the haunting out.
seed_pool:
  - { opening_token: "a cold spot in the hallway", opening_emoji: "🥶" }
  - { opening_token: "a rocking chair in the nursery", opening_emoji: "🪑" }
  - { opening_token: "a voice from the empty attic", opening_emoji: "🗣️" }
