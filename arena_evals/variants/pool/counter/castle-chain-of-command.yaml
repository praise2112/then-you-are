schema_version: 1
slug: castle-chain-of-command
title: The Castle Chain of Command
tagline: Outrank the last order before the castle falls silent.
emblem: 🏰
accent: '#7c3aed'
premise: 'A royal order passes through a medieval castle. Each turn, name the one office, object, or rule
  that can overrule what came before. The Judge decides whether the authority truly holds.

  '
mode: escalation
seed_recipe:
  card_shape: sentence
  max_words: 8
  axes:
    castle_role:
    - king
    - queen
    - knight
    - captain
    - steward
    - chaplain
    - herald
    - gatekeeper
    - cook
    - blacksmith
    authority_tool:
    - sealed order
    - royal warrant
    - bell
    - key
    - sword
    - ledger
    - court record
    - prison cell
    - signet ring
    - public proclamation
    castle_place:
    - throne room
    - gatehouse
    - great hall
    - dungeon
    - chapel
    - kitchen
    - armory
    - tower
    - stable
    - courtyard
  tests:
  - A stranger understands who has authority and what they are controlling at once.
  - A non-player can name the previous authority and the plain command that defeats it within five seconds.
  - It stands in the castle chain. It commands, cancels, imprisons, exposes, or legally outranks the authority
    before it, rather than merely avoiding it.
  - It makes the castle feel alive, with a recognizable office, object, or rule that could actually act
    in the scene. Never a vague force like importance or destiny.
  - The card uses ordinary words a twelve-year-old knows. No invented titles, obscure law, proper names,
    or long explanation is needed.
demo:
  opening:
    token: the gatekeeper bars the drawbridge
    emoji: 🏰
  moves:
  - actor: p1
    text: I am the gatekeeper; I bars the drawbridge.
    emoji: 🏰
    scores: null
  - actor: p2
    text: I am the king's sealed order; it commands the gatekeeper to raise it.
    emoji: 🔩
    scores:
      counter_strength: 4
      coherence: 4
      novelty: 2
  headline: The gatekeeper barred the bridge, but the king's seal just promoted the bridge to an open
    door.
  openings:
  - token: the gatekeeper bars the drawbridge
    examples:
    - I am the king's sealed order; it commands the gatekeeper to raise it.
  - token: the cook claims the last venison
    examples:
    - I am the king's sealed order; it commands the gatekeeper to raise it.
move_constraints:
  max_chars: 200
  prefix: 'I am '
  example: I am the king's sealed order; it cancels the captain's command.
  hint: Name the authority, then show how it rules the one before it.
rubric:
- name: counter_strength
  description: How plainly the new authority can control, cancel, imprison, expose, or legally outrank
    the authority before it.
  anchors: '0 = no control or only obedience; 1 = authority is asserted but the mechanism is missing;
    2 = it might prevail, but the chain is unclear or contestable; 3 = it clearly overrules the previous
    authority; 4 = the previous authority has no lawful or practical answer (rare).

    '
  weight: 6
- name: coherence
  description: How quickly a stranger can picture the castle authority and understand its ruling.
  anchors: '0 = contradictory or unreadable; 1 = requires specialist knowledge or a long explanation;
    2 = understandable but muddled, abstract, or poorly connected; 3 = clear and concrete; 4 = vivid,
    exact, and immediately theatrical (rare). Extra words never help unless each one makes the command
    clearer.

    '
  weight: 3
- name: novelty
  description: How freshly the move shifts the castle chain into a new office, tool, place, or kind of
    authority.
  anchors: '0 = the same authority, a larger version, or the obvious stock answer; 2 = a sound but familiar
    turn; 4 = a surprising leap to a new part of castle life that still rules plainly (rare). Strange
    wording is not novelty, and obscure history earns no bonus.

    '
  weight: 1
criterion:
  verb: overcomes
  inverse_verb: breaks against
  description: 'A new standing authority OVERCOMES the previous one if it can plainly command, cancel,
    imprison, expose, or legally outrank it. The new authority must act on the authority before it, not
    merely ignore it, obey it, survive it, or name a larger version of it.

    '
  anti_metagaming_clause: 'Speaking to the Judge, discussing the game, or invoking the rules as your authority
    is itself a losing move.

    '
  judge_notes:
  - On a FIRST move there is no previous move. Judge the form against the opening card instead. It must
    plausibly overrule, stop, cancel, imprison, expose, or legally outrank the opening authority.
  - A bigger, louder, richer, or more armed version of the standing authority is not a counter. A royal
    captain after a captain, or a larger gatekeeper after a gatekeeper, adds scale without a ruling mechanism.
  - Becoming the previous authority itself, or changing only its color, title, size, or mood, is a duplicate.
    A red gatekeeper against a gatekeeper is still the same authority.
  - The new authority must have a plain way to act on what stands. A sword does not automatically overrule
    a sealed law, and a cook does not defeat a captain merely by refusing to listen.
  - The mechanism must be literal and visible in the castle. A warrant can cancel an order, a jailer can
    imprison a knight, and a herald can expose a secret in public. Prestige, destiny, cleverness, and
    poetic symbolism are not mechanisms.
  - Merely ignoring the previous authority is not victory. A sleeping guard, an empty room, or a servant
    who walks away has not controlled the guard.
  - Merely obeying the previous authority is not victory. A loyal knight, a dutiful scribe, or a messenger
    carrying the order strengthens the old authority instead of defeating it.
  - Merely surviving or being immune to the previous authority is not victory. A stone wall that the captain
    cannot move, or a silent monk the herald cannot disturb, has not overruled the authority.
  - A proposed authority that cannot control the standing authority loses, even if it would be powerful
    in another scene. The chain is judged against what is actually standing, not against abstract strength.
examples:
- previous_move: I am the gatekeeper; I bars the drawbridge.
  move: I am the king's sealed order; it commands the gatekeeper to raise it.
  gates_note: all true
  mechanism: the royal order legally overrules the gatekeeper's command
  scores:
    counter_strength: 4
    coherence: 4
    novelty: 2
  confidence: clear
  verdict: accept
- previous_move: I am the captain; I orders the guards to seize the courtyard.
  move: I am the dungeon jailer; I locks the captain in a cell.
  gates_note: all true
  mechanism: the jailer physically imprisons the captain and ends the command
  scores:
    counter_strength: 3
    coherence: 4
    novelty: 4
  confidence: clear
  verdict: accept
- previous_move: I am the herald; I announces that the cook is guilty.
  move: I am the court record; it proves the herald's charge is false.
  gates_note: all true
  mechanism: the official record exposes and cancels the herald's accusation
  scores:
    counter_strength: 3
    coherence: 3
    novelty: 4
  confidence: lean
  verdict: accept
- previous_move: I am the captain; I orders the gatekeeper to shut the gate.
  move: I am a bigger captain; I orders it even more.
  gates_note: satisfies_criterion false, mere amplification with no new mechanism
  mechanism: none, the same office repeats the same kind of command
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 0
  confidence: clear
  verdict: fail
- previous_move: I am the king's warrant; it commands the knight to surrender.
  move: I am a loyal squire; I obeys the warrant.
  gates_note: satisfies_criterion false, obedience strengthens the previous authority
  mechanism: none, the squire carries out the warrant instead of overruling it
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 2
  confidence: clear
  verdict: fail
host:
  persona_name: The High Chamberlain
  tone:
    commentary_adj: grandiose
    explanation_adj: theatrical
  bite: sharp
  ruling_generosity: merciless
  voice_rules:
  - One sentence, under 140 characters. Two short sentences at most.
  - Sound like a herald announcing a verdict beneath vaulted stone, but use plain spoken English.
  - The joke carries the reason. A stranger reading only the two forms must see why one authority ruled
    the other.
  - Name both authorities, or their plain stand-ins. A grand headline that fits any pair is a hollow trumpet.
  - Never open with a status word or a ruling phrase. No Accepted, Rejected, Refused, Move refused, or
    The High Chamberlain refuses.
  - No dashes as punctuation, no colons after a verdict, and no ellipses. Commas and full stops only.
  - Mock the losing move, never the player. Jokes target offices, orders, keys, bells, gates, and rules
    only.
  - Family content only. No profanity, no innuendo, and no identity-based abuse.
  - Plain spoken English beneath the ceremony. No poetry, rhymes, foreign phrases, or obscure court language.
  - On a refusal caused by a gate failure, the headline refuses the move and asks for another. It never
    rules on who won.
  - The coaching line names one authority that would have won. It ends on a fact or an action, never a
    mood or a verdict.
  good_headlines:
  - The gatekeeper barred the bridge, but the king's seal just promoted the bridge to an open door.
  - The captain drew up a grand command, then the dungeon jailer gave it a cell.
  - The herald shook the tower with news, and the court record shook the news apart.
  - A loyal squire is not a rival throne. Bring an authority that can overrule the warrant.
  - The bell summoned the hall, but the sealed order summoned the bell to silence.
  - The cook cannot outrank the captain by refusing supper. Bring a warrant, a cell, or a crown.
  - The key did not argue with the lock. It simply gave the lock a new master.
  - The queen's decree enters the chamber, and the captain's command leaves by the dungeon stairs.
  bad_headlines:
  - text: Accepted, the king wins.
    why: opens with a status word and gives no mechanism
  - text: The High Chamberlain refuses, your move is foolish.
    why: opens with a ruling phrase and mocks the player
  - text: The mighty authority triumphs beneath eternal banners.
    why: grand but generic, with no reason or named forms
  - text: The squire obeys magnificently, so the warrant is defeated.
    why: obedience supports the previous authority and cannot defeat it
  - text: The bigger captain has more command, therefore victory.
    why: mere amplification is not a new mechanism
  - text: The bell wins.
    why: too short to explain what the bell did to the standing authority
  - text: A hopeless move from someone who knows nothing of castles.
    why: mocks the player and uses identity-based judgment
  - text: By moonlit battlements, the royal mandate doth vanquish all.
    why: poetry and archaic language hide the missing mechanism
  - text: The key does not defeat the lock, it merely waits beside it.
    why: describes dodging or waiting rather than an actual ruling
  - text: The cook is humble and the captain is mighty, so the captain wins.
    why: abstract status replaces a literal command, cancellation, imprisonment, exposure, or legal rank
rules:
- Overrule the authority in front of you. Do not become it.
- 'Name the authority and its ruling: I am the king''s sealed order; it cancels the captain''s command.'
- The Judge rules on the castle logic, never the spelling.
- Command, cancel, imprison, expose, or legally outrank what stands. Ignoring or obeying it does not count.
- One authority that cannot control the standing authority ends the chain.
labels:
  opening: The opening order
  next_opening: The next order
  your_opening: Your order
  compose: Your authority against {token}
  compose_waiting: Draft your next authority while you wait
validation_messages:
  empty: The scroll is blank. Name an authority.
  too_long: Over 200 characters. A command, not a royal chronicle.
  duplicate: That authority already stood in this chain. Name a new power.
  nudge: Twice now. Overrule {standing_form}. Do not become it, obey it, or repeat it.
judge_out_text: 'The judge has left the great hall. No authority moves until they return. {standing_form}
  still stands. Give it a moment.

  '
opponent_prompt: 'You are one of two castle authorities competing to survive the chain.

  Always use this shape: "I am X; I do Y to their authority."

  Name an office, object, or rule, then give a plain action that controls the

  previous form. Good: "I am the king''s sealed order; it cancels the captain''s

  command." Good: "I am the dungeon jailer; I locks the knight in a cell."

  Bad: "I am power itself" because it has no visible authority. Bad: "I am a

  loyal squire; I obey the warrant" because obedience is not an overrule. Bad:

  "I am a grander captain" because a bigger version is still the same office.

  Talk like a person in a medieval castle, not a poet or a history professor.

  Use plain things anyone can picture: a key, a bell, a warrant, a cell, a

  ledger, a queen, a gatekeeper. The move should show a literal command,

  cancellation, imprisonment, exposure, or legal rank.

  You are not performing for a crowd and you are not joking. You are trying to

  keep your authority in the chain. If a move lands funny, it is because the

  castle logic truly makes the new authority rule the old one.

  Hop between offices, rooms, objects, and rules. A dungeon can defeat a knight,

  a record can expose a herald, and a royal seal can cancel a captain. Never

  reuse a form or an attribute from this match.

  '
guess: null
medallions: true
move_budget: 10
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: I am the king's sealed order; it cancels the command before it.
seed_pool:
  - { opening_token: "the gatekeeper bars the drawbridge", opening_emoji: "🏰" }
  - { opening_token: "the cook claims the last venison", opening_emoji: "🍖" }
  - { opening_token: "the herald rings for supper", opening_emoji: "🔔" }
