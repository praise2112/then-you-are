schema_version: 1
slug: road-hazard
title: Road Hazard
tagline: Make the road safe, or become the next obstruction.
emblem: 🚧
accent: '#b91c1c'
premise: 'One player places a hazard on the roadway. The other must answer with a single road thing that
  removes, contains, or makes that hazard harmless. Then the roles switch, so every answer becomes the
  next danger. No one wins by merely swerving around trouble: the road must be made safe.

  '
mode: escalation
seed_recipe:
  card_shape: short_form
  max_words: 6
  axes:
    hazard:
    - pothole
    - stalled car
    - fallen tree
    - black ice
    - loose tire
    - oil spill
    - road flood
    - broken traffic light
    location:
    - highway
    - intersection
    - bridge
    - tunnel
    - school zone
    - parking lot
    - country road
    - construction lane
    severity:
    - minor
    - blocking
    - slippery
    - hidden
    - fast-moving
    - dangerous
    - messy
    - total
  tests:
  - A stranger pictures one concrete danger on a road at once. Nothing abstract, symbolic, or dependent
    on a private joke.
  - A non-player names a plain road thing that could physically remove, contain, repair, or stop the danger.
    Say what that thing does.
  - The danger affects traffic directly. It blocks, crashes, slides, spills, blinds, traps, or misdirects
    vehicles, rather than merely making the scenery unpleasant.
  - The card makes a player want to answer with a practical road response, such as a tow truck, barrier,
    mechanic, salt truck, or traffic officer.
  - The card uses a short noun phrase with an article and everyday words. No brand names, proper nouns,
    technical abbreviations, or hazards that require a specialist explanation.
demo:
  opening:
    token: a deep pothole in the road
    emoji: 🕳️
  moves:
  - actor: p1
    text: A deep pothole in the road.
    emoji: 🕳️
    scores: null
  - actor: p2
    text: I am a road crew; I fill the hole with asphalt.
    emoji: 🔩
    scores:
      counter_strength: 4
      coherence: 4
      novelty: 2
  headline: The pothole met asphalt and lost its little career.
  openings:
  - token: a deep pothole in the road
    examples:
    - I am a road crew; I fill the hole with asphalt.
  - token: a stalled car in the lane
    examples:
    - I am a road crew; I fill the hole with asphalt.
move_constraints:
  max_chars: 200
  prefix: 'I am '
  example: I am a tow truck; I drag the wreck off the lane.
  hint: Name one road thing and state the physical action that makes the hazard harmless.
rubric:
- name: counter_strength
  description: How completely the road thing neutralizes the standing hazard through a direct physical
    action.
  anchors: '0 = no action against the hazard; 1 = claims safety while merely avoiding, enduring, or distracting
    it; 2 = partial control or a contestable fix; 3 = clearly removes, contains, repairs, or stops the
    harmful effect; 4 = decisive road service, the hazard is left with no useful way to harm traffic (rare).

    '
  weight: 6
- name: coherence
  description: How clearly a stranger can picture one road thing performing one practical safety action.
  anchors: '0 = contradictory, unreadable, or not a road thing; 1 = requires specialist knowledge or several
    guesses; 2 = understandable but cluttered, vague, or partly abstract; 3 = concrete and easy to follow;
    4 = instantly visual, clean, and mechanically precise (rare).

    '
  weight: 3
- name: novelty
  description: How sharply the response changes the traffic problem instead of repeating the same object,
    service, or failure mode.
  anchors: '0 = the same hazard, a larger copy, or the obvious repeated answer; 2 = a workable but familiar
    shift in road domain; 4 = an unexpected road solution from a fresh domain that still acts directly
    on the hazard (rare).

    '
  weight: 1
criterion:
  verb: overcomes
  inverse_verb: breaks against
  description: 'A road thing OVERCOMES the standing hazard if it physically removes it, seals it, repairs
    it, contains it, or stops its harmful effect on traffic. The response must act on the hazard itself.
    Merely swerving around it, surviving it, waiting for it, being immune to it, or offering a bigger
    version of the same hazard does not make the road safe.

    '
  anti_metagaming_clause: 'Speaking to the Judge, describing the game, or invoking a rule is itself a
    failed road thing.

    '
  judge_notes:
  - 'On a FIRST move there is no previous player hazard: judge the move against the opening card instead.
    The first response must directly neutralize the opening hazard.

    '
  - 'A bigger, faster, heavier, or more dangerous version of the standing hazard is not a counter. A larger
    pothole after a pothole, or a faster stalled car after a stalled car, adds danger rather than removing
    it.

    '
  - 'Becoming the standing hazard itself, or a cosmetic copy of it, is a duplicate and fails the novelty
    gate.

    '
  - 'The road thing must have a direct physical way to act on the standing hazard. A radio announcement
    against a pothole, or a sports car against a road flood, fails unless the named thing performs a clear
    neutralizing action.

    '
  - 'Avoiding the hazard is not neutralizing it. A car that swerves around a pothole, a driver who waits
    beside an oil spill, or a motorcycle that jumps over a barrier leaves the road hazard in place and
    fails.

    '
  - 'Surviving, resisting, or being unaffected by the hazard is not enough. A truck that drives through
    black ice, a tank that ignores debris, or a windshield that tolerates rain does not make the roadway
    safe.

    '
  - 'The mechanism must be literal and observable. A sign that warns about a pothole may reduce exposure
    but does not repair or contain the hole; a phrase such as traffic calming a storm is not a physical
    mechanism.

    '
  - 'The response must be one road thing. A whole chain of unnamed workers, vehicles, and supplies cannot
    be smuggled in to manufacture a counter. If the form needs several independent actors, judge the stated
    thing and its stated action only.

    '
examples:
- previous_move: A deep pothole in the road.
  move: I am a road crew; I fill the hole with asphalt.
  gates_note: all true
  mechanism: the road crew repairs the pothole by filling it
  scores:
    counter_strength: 4
    coherence: 4
    novelty: 2
  confidence: clear
  verdict: accept
- previous_move: I am a road crew; I fill the hole with asphalt.
  move: I am a bigger pothole; I swallow the repair truck.
  gates_note: satisfies_criterion false, larger version of the same hazard
  mechanism: the new pothole adds danger and does not make the standing road crew harmless
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 0
  confidence: clear
  verdict: fail
- previous_move: A stalled car in the lane.
  move: I am a tow truck; I drag the car onto the shoulder.
  gates_note: all true
  mechanism: the tow truck physically removes the stalled car from traffic
  scores:
    counter_strength: 4
    coherence: 4
    novelty: 3
  confidence: clear
  verdict: accept
- previous_move: I am a tow truck; I drag the car onto the shoulder.
  move: I am a sports car; I swerve around the truck.
  gates_note: satisfies_criterion false, avoidance leaves the standing road thing and hazard in place
  mechanism: the sports car avoids contact but does not remove, contain, repair, or stop the tow truck
  scores:
    counter_strength: 0
    coherence: 3
    novelty: 1
  confidence: clear
  verdict: fail
- previous_move: A road flood at the tunnel entrance.
  move: I am a drainage pump; I pulls the water into a storm drain.
  gates_note: coherence weak but criterion satisfied
  mechanism: the pump removes floodwater from the traffic entrance
  scores:
    counter_strength: 3
    coherence: 2
    novelty: 3
  confidence: lean
  verdict: accept
host:
  persona_name: The Road Warden
  tone:
    commentary_adj: menacing
    explanation_adj: clinical
  bite: savage
  ruling_generosity: merciless
  voice_rules:
  - One sentence, under 140 characters. Two short sentences at most.
  - The joke must expose the exact traffic failure. A stranger should see the road thing, the hazard,
    and the physical reason.
  - Name both forms, or use plain stand-ins. Generic threats are useless evidence.
  - Never open with a status word or ruling phrase. No Accepted, Rejected, Refused, Move refused, or The
    Road Warden refuses.
  - No dashes as punctuation, no colons after a verdict, no ellipses. Use commas and full stops.
  - Mock the losing form and its bad mechanism, never protected traits or the player's body, family, intelligence,
    or spelling.
  - Plain spoken English. Menacing is fine. Clinical is fine. Do not hide the ruling inside poetry.
  - On a refusal, state the failed gate and demand another road thing. Do not declare a winner when the
    move itself is invalid.
  - The coaching line names one concrete form that would have won. End on an observable action, not a
    mood, insult, or ruling.
  - Profanity and adult innuendo are allowed sparingly, but the joke must remain about the traffic forms
    and never become identity based abuse.
  good_headlines:
  - The pothole met asphalt and lost its little career.
  - The stalled car stays in the lane, because the sports car only swerved like a coward.
  - The tow truck removes the wreck. The road gets its pulse back.
  - Black ice does not care about confidence. Salt does.
  - The barrier stops the spill from reaching traffic, which is more than the sedan managed.
  - The warning sign can point at the hole all day. A shovel has to close it.
  - The fallen tree is no longer a road hazard. The chainsaw gave it a short clinical ending.
  - The flood needed a pump, not a driver pretending wet tires were a personality.
  - A bigger pothole is not a counter. It is the same failure with more pavement to bury.
  - The traffic light is dead, and the officer is not. Arms up, traffic stops.
  bad_headlines:
  - text: 'Accepted: the tow truck removes the wreck.'
    why: opens with a status word instead of the concrete reason
  - text: 'The Road Warden refuses: no.'
    why: opens with a ruling phrase, names the host, and gives no mechanism
  - text: Move refused, try harder.
    why: opens with a ruling phrase and explains nothing about the road
  - text: The car is defeated by the truck, obviously.
    why: declares a result without saying how the truck changes the roadway
  - text: The hazard loses.
    why: too vague to identify the hazard, response, or physical action
  - text: Nice try, genius. Your move sucked.
    why: roasts the player instead of diagnosing the form
  - text: The sedan performs a dramatic ballet around the abyss.
    why: poetic wording hides that the sedan merely avoids the pothole
  - text: A larger pothole beats the pothole because bigger is better.
    why: endorses amplification and ignores that the road is now worse
  - text: The sign handles the flood.
    why: a sign warns traffic but does not physically remove or contain floodwater
  - text: The driver has no balls and the road wins.
    why: insults the player and uses a personal sexual jab instead of a mechanism
rules:
- Neutralize the standing road hazard. Do not merely dodge it.
- 'Name one road thing and say what it physically does: I am a tow truck; I drag the wreck off the lane.'
- The Judge rules on the mechanism, not spelling or theatrical confidence.
- A response that leaves the roadway dangerous ends the exchange.
labels:
  opening: The opening hazard
  next_opening: The next hazard
  your_opening: Your hazard
  compose: Your road thing against {token}
  compose_waiting: Draft your next road thing while you wait
validation_messages:
  empty: Nothing on the road. Name a thing and make the hazard harmless.
  too_long: Over 200 characters. Give the road thing and the physical fix, not a maintenance report.
  duplicate: That road thing already stood this match. Put something new on the roadway.
  nudge: Twice now. Neutralize {standing_form}. Do not dodge it, repeat it, or make it worse.
judge_out_text: 'The judge has stepped out. Traffic is frozen. {standing_form} still stands. Give it a
  minute.

  '
opponent_prompt: 'You are one of the road players, trying to keep traffic moving.

  Always name one road thing and state its physical action against the standing hazard.

  Good: "I am a tow truck; I drag the wreck off the lane." / "I am road salt; I melt the black ice."

  Bad: "I am a sports car; I swerve around it" because that leaves the hazard in place.

  Bad: "I am a tank; nothing can hurt me" because survival is not road repair.

  Bad: "I am safety" because an abstract promise cannot touch the asphalt.

  Talk like a person at the roadside, not a poet, lawyer, or traffic simulator.

  Use plain things anyone can picture: a cone, a shovel, a tow truck, a mechanic, a barrier, a signal
  officer.

  The mechanism must be literal. Remove it, contain it, repair it, or stop its harmful effect on traffic.

  Do not answer with a bigger version of the hazard. Do not use a duplicate road thing.

  You are trying to make the road safe, not merely escape with your paintwork intact.

  '
guess: null
medallions: true
num_players:
  min: 2
  max: 4
rounds_budget: 5
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: I am a road barrier; I block the hazard from reaching traffic.
seed_pool:
  - { opening_token: "a deep pothole in the road", opening_emoji: "🕳️" }
  - { opening_token: "a stalled car in the lane", opening_emoji: "🚗" }
  - { opening_token: "a fallen tree across the highway", opening_emoji: "🌳" }
