    emoji: 🎂
    scores:
      reach: 2
      link: 4
      picture: 3
  headline: The books meet the window and a reading corner appears. The house has made one sensible decision.
  openings:
  - token: A box marked BOOKS waits in the empty front room beside the window.
    examples:
    - Then the BOOKS box goes under the window, so the front room becomes a reading corner.
  - token: A box of kitchen plates is left in the narrow room beneath the stairs.
    examples:
    - Then the BOOKS box goes under the window, so the front room becomes a reading corner.
move_constraints:
  max_chars: 140
  prefix: 'Then '
  example: Then the box of bath towels goes in the study, so the study now has a soft wall around the
    desk.
  hint: Name one box, where it goes, and the immediate room change caused by placing it.
rubric:
- name: reach
  description: How much useful or amusing new purpose the placement gives the house.
  anchors: 0 = no room change, or the house becomes less usable; 1 = a tiny adjustment, such as clearing
    a path; 2 = one clear new use or feature appears; 3 = the placement changes how a room connects to
    the rest of the house; 4 = one box gives the house a striking new purpose that still fits the floor
    plan, rare. Reach is earned only when the box placement causes the change.
  weight: 5
- name: link
  description: How clearly the new room fact comes from that exact box being placed there.
  anchors: 0 = the box and room have no shown connection; 1 = the connection is merely announced; 2 =
    it makes sense with a little explanation; 3 = a stranger immediately sees why the box changes the
    room; 4 = the result feels natural and inevitable, rare. A move that places the box and then invents
    an unrelated event scores no higher than 2.
  weight: 4
- name: picture
  description: How plainly a stranger can picture the box, its place, and the changed room.
  anchors: 0 = unclear, abstract, or missing an event; 1 = vague or overloaded; 2 = understandable but
    plain; 3 = the room is easy to see; 4 = one precise detail makes the new purpose memorable, rare.
    Extra furniture or fancy wording does not earn points by itself.
  weight: 2
criterion:
  verb: follows from
  inverse_verb: snaps off
  description: A move FOLLOWS if it names exactly one box, places or opens it, says where it goes, and
    shows one immediate room fact caused by that action. The new fact must fit the rooms and placements
    already established. A move fails when it places no box, handles two or more boxes, skips from arrival
    to a finished renovation, makes an unrelated change, contradicts the standing floor plan, finishes
    the house, or moves a box that was already placed without showing a real new arrangement.
  anti_metagaming_clause: 'Speaking to the Judge, discussing the game, or referring to rules instead of
    moving a box is itself a broken move.

    '
  judge_notes:
  - 'On a FIRST move there is no standing move: judge it against the card and the visible floor plan.
    It must place or open one box and create one room fact from that action.'
  - Exactly one box means one named container or bundle. A box of mixed objects counts as one box, but
    placing a box and a rug as separate items is two placements and fails.
  - A new room fact must be immediate and caused by the placement, such as a box of lamps making a reading
    corner or garden tools making the porch a potting space.
  - A new room or connection may be introduced only if the move makes it part of the floor plan in a plain
    way. A box in the hallway can reveal a blocked passage, but it cannot summon a basement that was never
    suggested.
  - A move that jumps from putting down one box to a fully decorated room, a completed office, or a finished
    house skips arranging steps and fails.
  - An ending is any move that completes the house, declares every room settled, finishes the move, or
    leaves nothing useful or strange to arrange. Endings fail even when the placement is sensible.
  - Undoing a placement fails. Moving a box from the study back to the van, erasing a room fact, or restoring
    the previous arrangement is not a new arrangement.
  - Contradicting the floor plan fails. A box cannot be in the attic and the porch at once, and a newly
    claimed doorway cannot be treated as open if an earlier move made it blocked.
  - A move that merely puts the box down without changing the room follows the physical action but scores
    low on reach and may fail if no new room fact is stated.
  - If a move includes two effects caused by one placement, it may pass when both are one immediate room
    fact. Score link at 2 or below if the sentence hides several separate changes.
