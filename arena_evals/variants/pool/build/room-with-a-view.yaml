schema_version: 1
slug: room-with-a-view
title: The Floor Plan Has Opinions
tagline: Move one box, reveal one room, and let the house quietly judge your choices.
emblem: 📦
accent: '#7c3aed'
premise: 'A moving crew places boxes in a new house while you discover what each room is really for. Every
  move adds one box and one small change to the floor plan, until the house has a strange but usable purpose.
  Be helpful first; the house will supply the roast.

  '
mode: escalation
seed_recipe:
  card_shape: sentence
  max_words: 18
  axes:
    box:
    - books
    - bath towels
    - kitchen plates
    - winter clothes
    - garden tools
    - board games
    - lamps
    - old photographs
    - cleaning supplies
    room:
    - front room
    - study
    - small bedroom
    - room beneath the stairs
    - sunroom
    - hallway
    - attic
    - back porch
    - dining room
    arrival:
    - waits beside the window
    - leans against the door
    - sits under the stairs
    - blocks half the room
    - rests near the fireplace
    - stands by the empty shelf
    - has just come through the front door
    - is carried up from the van
    - is left beneath a bare light
  tests:
  - One box and one room give a stranger a clear picture. Present tense, one sentence, plain words.
  - A player can place the box somewhere sensible and reveal a useful or odd room purpose in one move.
  - Nothing on the card finishes the house or explains every room. It is a starting arrangement, not a
    floor plan lecture.
  - No one is harmed, no real person is named, and the card contains no brand, crime, or private information.
  - The card invites a helpful placement with a small comic risk. It feels like moving day, not a warehouse
    inventory.
demo:
  opening:
    token: A box marked BOOKS waits in the empty front room beside the window.
    emoji: 📚
  moves:
  - actor: p1
    text: A box marked BOOKS waits in the empty front room beside the window.
    emoji: 📚
    scores: null
  - actor: p2
