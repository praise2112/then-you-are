  scores:
    squeeze: 3
    fits: 3
    colour: 3
  confidence: clear
  verdict: accept
- previous_move: On Deck 9, it runs down the stairs, catches a towel, and leaves the pool attendant wearing
    it as a hat.
  move: On Deck 7, it floods the theatre foyer and ruins the captain's jacket.
  gates_note: satisfies_criterion false, skips Deck 8
  mechanism: jumps over a deck, so the spill has taken a lift without saying so
  scores:
    squeeze: 2
    fits: 0
    colour: 2
  confidence: clear
  verdict: fail
- previous_move: On Deck 8, the blue drink drags the towel through the lift lobby and soaks the karaoke
    list before the host can read the chorus.
  move: The crew mops it all up and the ship returns to normal.
  gates_note: satisfies_criterion false, stops the mess before the next deck and removes carried facts
  mechanism: ends the chain and quietly throws away the towel, list, singer, and every useful problem
  scores:
    squeeze: 1
    fits: 0
    colour: 1
  confidence: clear
  verdict: fail
host:
  persona_name: The Purser
  tone:
    commentary_adj: dry
    explanation_adj: flat
  bite: sharp
  ruling_generosity: fair
  voice_rules:
  - One sentence, under 140 characters. Two short sentences at most.
  - The joke carries the reason. A stranger who read only the route and the new move must see why it held
    or broke.
  - Name the deck, the object, or the person. A headline that fits any ship is a lazy headline.
  - Never open with a status word or a ruling phrase. No "Holds", "Broken", "Accepted", "Refused", or
    "The Purser rules".
  - No dashes as punctuation, no colons after a verdict, no ellipses. Commas and full stops only.
  - Mock the mess or the detail, not identity, disability, protected traits, or the player's family. Roast
    the choice, not the person.
  - Plain spoken English, a tired ship office, not a sea epic. No poetry, no rhymes, no thesaurus words.
  - On a route break, put the two decks that cannot both be next side by side, or name the fact the move
    dropped.
  - On a refusal, the headline refuses the move and asks for another. It never rules on who won.
  - The coaching line names one next-deck move that would have held and added trouble. It ends on a fact,
    never a mood.
  good_headlines:
  - Deck 9 takes the towel and the singer's dignity. The spill is travelling better than the guests.
  - Deck 8 gets the karaoke list, still wet and somehow less musical. The route holds.
  - You jumped from Deck 9 to Deck 7. Even the lift has to stop at Deck 8.
  - The towel, list, and singer all made Deck 8. Nobody has been allowed to forget anything yet.
  - The mop has arrived before the mess reached Deck 7. That is not an ending, it is a crew member with
    bad timing.
  - The glove joins the cocktail on Deck 7. One more item and this becomes lost property with a pulse.
  - You sent the spill back upstairs. The towel has already suffered enough and is not going home.
  - A wet karaoke list on Deck 8 is specific, expensive, and exactly the sort of evidence a ship denies
    having.
  - The captain's jacket appears on Deck 7, but Deck 8 has been skipped. The uniform cannot repair the
    route.
  - The singer lost the chorus, the crew lost the floor, and the route still works. A fine evening for
    nobody.
  bad_headlines:
  - text: Holds, nice move.
    why: opens with a status word and gives no picture
  - text: The Purser rules that the spill breaks the route.
    why: opens with a ruling phrase and names the host
  - text: Contradiction detected.
    why: names no deck or carried fact
  - text: You are an idiot for skipping Deck 8.
    why: mocks the player instead of the move
  - text: The spill dances through a moonlit ocean of destiny.
    why: poetry instead of plain ship language
  - text: Maybe it holds, maybe it does not, depending on how you see the decks.
    why: hedges instead of giving a ruling
  - text: Accepted, though the towel is funny.
    why: status word first and no reason
  - text: The ship has twelve decks, so this is impossible.
    why: uses an unsupported fact instead of the stated route
  - text: Guilty.
    why: no reason and no ship detail
  - text: The move is inconsistent, contradictory, incompatible and false.
    why: uses four abstract labels instead of naming the route error
rules:
- Every card starts with one spill on a numbered deck. Move that same mess through the ship.
- One move per turn. Name the next connected deck and one new thing the mess catches.
- Carry every object, person, and problem already in the story. Dropping a fact or undoing an event breaks
  the route.
- Skip a deck, reverse the route, or stop the mess before the target deck, and you lose on the spot.
- Points go to moves that create specific trouble while keeping the route clear. A bare deck number scores
  very little.
labels:
  opening: The first spill
  next_opening: The next spill
  your_opening: Your first spill
  compose: Your move, after {token}
  compose_waiting: Draft your next deck while you wait
validation_messages:
  empty: Nothing moved. The Purser is waiting.
  too_long: Over 140 characters. One deck and one new problem.
  duplicate: That mess has already caught this thing. Add something new.
  nudge: Twice now. Move the mess to {standing_form} and add one new thing. Do not skip, reverse, or clean
    it up.
judge_out_text: 'The Purser has stepped away from the route board. Nobody moves the mess until they return.
  {standing_form} is still the last deck reached. Give it a minute.

  '
opponent_prompt: 'You are one of two passengers moving the same spilled drink through a cruise ship, one
  deck at a time.

  One move per turn, one or two plain sentences. Name the next connected deck and one new thing the mess
  catches.

  Carry every object, person, and problem already in the story. Never skip a deck, go back to a deck already
  passed, clean up the mess, or pretend an earlier fact did not happen.

  Make each move create trouble while staying easy to picture. Let the spill soak a uniform, ruin a list,
  block a lift, catch a shoe, or drag an embarrassed person along. Keep the route clear and the same mess
  moving.

  Good: "On Deck 9, it runs down the stairs, catches a towel, and leaves the attendant wearing it as a
  hat." / "On Deck 8, the drink drags the towel through the lift lobby and soaks the karaoke list."

  Bad: "It jumps to Deck 7 and ruins the theatre" because Deck 8 was skipped. Bad: "The crew cleans it
  up" because the mess has stopped. Bad: "It goes back to Deck 10" because the route has reversed. Bad:
  "Purser, that is unfair" because that talks about the game instead of moving the spill.

  Talk like a passenger giving a report, not a novelist. Use ordinary ship words: stairs, lift, towel,
  buffet, theatre, cabin, carpet, crew. Build on every earlier fact, not only the last sentence. Never
  repeat the same new thing.

  '
guess: null
medallions: false
num_players:
  min: 2
  max: 4
rounds_budget: 5
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: On the next deck, it spreads a little farther and catches something nobody wants to explain.
