  scores:
    squeeze: 4
    fits: 4
    colour: 4
  confidence: clear
  verdict: accept
- previous_move: On Deck 8, the blue drink drags the towel through the lift lobby and soaks the karaoke
    list before the host can read the chorus.
  move: On Deck 7, it reaches the theatre doors, catches a dropped glove, and makes the singer perform
