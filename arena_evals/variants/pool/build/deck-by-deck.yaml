schema_version: 1
slug: deck-by-deck
title: Deck by Deck
tagline: One spill, every deck. Keep the mess moving and your dignity sinking.
emblem: 🛳️
accent: '#0f766e'
premise: 'Start with one spilled drink and move the same mess through the ship, one deck at a time. Each
  move must say where the mess goes next and what it picks up. Dry commentary is free; dry carpet is not.

  '
mode: escalation
seed_recipe:
  card_shape: sentence
  max_words: 20
  axes:
    drink:
    - a blue cocktail
    - orange juice
    - melted ice cream
    - red punch
    - sparkling water
    - a milkshake
    - iced coffee
    - a glass of lemonade
    start_place:
    - outside the pool bar
    - beside the theatre doors
    - near the buffet
    - by the casino entrance
    - outside the main dining room
    - beside the lift
    - near the gift shop
    - under the grand staircase
    start_deck:
    - Deck 10
    - Deck 9
    - Deck 8
    - Deck 7
    - Deck 6
    - Deck 5
    - Deck 4
    - Deck 3
  tests:
  - One plain sentence with a drink, a starting place, and a numbered deck.
  - The first spill is harmless, silly, and easy to picture. Nobody is badly hurt, nobody dies, and no
    real person is named.
  - The starting deck leaves at least three connected decks for the mess to reach.
  - The ship setting is clear without using a real cruise line, ship name, port, or street name.
  - Everyday words a twelve-year-old knows. The spill must be something that can spread, soak, stain,
    drip, or slide.
demo:
  opening:
    token: A blue cocktail spills outside the pool bar on Deck 10.
    emoji: 🍹
  moves:
  - actor: p1
    text: A blue cocktail spills outside the pool bar on Deck 10.
    emoji: 🍹
    scores: null
  - actor: p2
    text: On Deck 9, it runs down the stairs, catches a towel, and leaves the pool attendant wearing it
      as a hat.
    emoji: 😭
    scores:
      squeeze: 3
      fits: 3
      colour: 4
  headline: Deck 9 takes the towel and the singer's dignity. The spill is travelling better than the guests.
  openings:
  - token: A blue cocktail spills outside the pool bar on Deck 10.
    examples:
    - On Deck 9, it runs down the stairs, catches a towel, and leaves the pool attendant wearing it as
      a hat.
  - token: A tray of orange juice tips beside the theatre doors on Deck 7.
    examples:
    - On Deck 9, it runs down the stairs, catches a towel, and leaves the pool attendant wearing it as
      a hat.
move_constraints:
  max_chars: 140
  prefix: ''
  example: On Deck 9, it runs down the stairs, soaks the towel cart, and leaves the attendant wearing
    one as a hat.
  hint: Name the next connected deck and one new thing the mess catches. Carry the whole disaster with
    you.
rubric:
- name: squeeze
  description: How much trouble the new thing creates for the ship, the people in it, or the next player,
    without breaking the chain.
  anchors: '0 = the mess catches nothing worth noticing; 1 = a small stain or a mildly annoyed worker;
    2 = a real nuisance, a ruined list, a wet uniform, or a blocked path; 3 = a specific person or ship
    system now has to deal with the mess; 4 = the new problem is vivid, awkward, and leaves the next move
    on a narrow ledge (rare). A disaster that ends the chain or ignores what is already aboard scores
    1 at most.

    '
  weight: 6
- name: fits
  description: Whether the move reaches the right next deck and carries the spill, its objects, people,
    and problems forward.
  anchors: '0 = skips a deck, reverses the route, drops a carried fact, or stops the mess; 1 = names a
    deck but adds little and leaves the chain unclear; 2 = reaches the connected next deck and carries
    the main mess; 3 = reaches it cleanly while carrying the important facts; 4 = makes the new deck feel
    like the unavoidable result of everything before it (rare). Fancy detail cannot repair a broken route.

    '
  weight: 3
- name: colour
  description: How clearly the move makes the ship and the spreading mess appear in the mind.
  anchors: '0 = a bare route with no picture; 1 = one plain object; 2 = a visible action or reaction;
    3 = a strong shipboard image with a person, sound, or texture; 4 = the scene is so exact a stranger
    can see the crew trying not to swear (rare). Plain concrete words beat grand ones.

    '
  weight: 1
criterion:
  verb: holds
  inverse_verb: breaks
  description: 'A move HOLDS if it advances the mess to one connected next deck while carrying every object,
    person, and problem already aboard. The next deck must be the immediate connected deck in the route,
    not a skipped level, a jump to another part of the ship, or a return to a deck already passed. The
    move must add one new thing the mess catches, so an ending that merely stops or says the spill is
    cleaned up does not hold. An undo sends the mess back, removes a carried fact, or pretends an earlier
    event never happened. The move may make the mess spread, drip, soak, smear, stain, block, or drag
    things along, but it must remain the same mess. Points go to the trouble and imagery added by the
    move. A safe route with no new problem scores near zero.

    '
  anti_metagaming_clause: 'Talking to the host about the game, the rules, the route, or the partner''s
    play instead of moving the mess is itself a broken move.

    '
  judge_notes:
  - 'On a FIRST move there is no earlier move: judge it against the card alone. It must name the immediately
    connected next deck, keep the original spill moving, and add one new thing it catches.'
  - The full transcript is the route. Check the new move against every earlier move, not only the last
    one.
  - A skipped link is a failure even if the destination is on the ship. The mess must move one connected
    deck at a time.
  - An ending fails if it stops the mess before the target deck, says it was cleaned up, dries it completely,
    or otherwise removes the need for another move.
  - An undo fails if it sends the mess back to a deck already passed, removes an object, person, or problem
    that was carried forward, or says an earlier event did not happen.
  - The next move may add people, objects, stains, smells, noise, or damage, as long as all earlier facts
    remain aboard and the mess itself keeps moving.
  - 'A move that repeats the same new thing without adding anything is a duplicate: not_semantic_duplicate
    is false.'
  - When a move can be read either way, it holds. Break only on a plain route error, a clear reversal,
    a dropped fact, a stopped mess, or a move that talks about the game instead of the ship.
examples:
