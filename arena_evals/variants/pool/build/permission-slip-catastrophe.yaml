schema_version: 1
slug: permission-slip-catastrophe
title: Permission Slip Catastrophe
tagline: One trip, thirty witnesses, and a permission slip that keeps getting worse.
emblem: 🚌
accent: '#b91c1c'
premise: 'The school trip has gone gloriously wrong, and the permission slip is being rewritten one line
  at a time. Add the next true detail before the paper reaches the head teacher; make it more embarrassing
  for your partner if you can. The host announces each addition like a fresh scandal.

  '
mode: escalation
seed_recipe:
  card_shape: sentence
  max_words: 34
  axes:
    destination:
    - closed theme park
    - wrong museum
    - farm visitor centre
    - castle ruin
    - aquarium on a Tuesday
    - railway platform
    - sports stadium
    - village hall
    complication:
    - the tickets are for tomorrow
    - the teacher has lost the class list
    - the bus driver has locked the keys inside
    - a suitcase is making a noise
    - the pupils have been given another school's lunch
    - the guide is expecting a wedding party
    - one teacher is wearing a mascot costume
    - the return money is missing
    witnesses:
    - thirty pupils and two teachers
    - one guide and a queue of pensioners
    - a bus driver and the head teacher's dog
    - two parents and a security guard
    - a choir arriving early
    - a farmer with a clipboard
    - a caretaker and three lost tourists
    - a coach full of rival pupils
  tests:
  - One plain sentence with a school trip, a destination, and a problem already in progress.
  - Nobody is seriously hurt, no real person is named, and the disaster stays comic rather than dangerous.
  - A stranger can see who is present and name the place where the next line must begin.
  - The opening leaves room for several linked consequences without solving the whole trip at once.
  - Everyday words a twelve-year-old knows. No brand names, street names, or specialist school jargon.
demo:
  opening:
    token: The bus has stopped outside a closed theme park, with thirty pupils, two teachers, and one
      suspiciously warm suitcase.
    emoji: 🎢
  moves:
  - actor: p1
    text: The bus has stopped outside a closed theme park, with thirty pupils, two teachers, and one suspiciously
      warm suitcase.
    emoji: 🎢
    scores: null
  - actor: p2
    text: The teacher has just discovered that the tickets are for tomorrow, and my mate here is still
      waving them at the locked gate.
    emoji: 😭
    scores:
      squeeze: 3
      fits: 3
      colour: 4
  headline: Tomorrow's tickets, yesterday's confidence, and your partner still at the gate. A magnificent
    opening disgrace.
  openings:
  - token: The bus has stopped outside a closed theme park, with thirty pupils, two teachers, and one
      suspiciously warm suitcase.
    examples:
    - The teacher has just discovered that the tickets are for tomorrow, and my mate here is still waving
      them at the locked gate.
  - token: The class has arrived at the wrong museum, where the guide is waiting for a group from another
      school and one pupil is carrying the head teacher's lunch.
    examples:
    - The teacher has just discovered that the tickets are for tomorrow, and my mate here is still waving
      them at the locked gate.
move_constraints:
  max_chars: 140
  prefix: ''
  example: The teacher has just discovered that the tickets are for tomorrow, and thirty pupils are now
    pretending to study the map.
  hint: Add one line to the same permission slip. Follow the last fact, then make your partner look worse.
rubric:
- name: squeeze
  description: How sharply this line embarrasses or burdens your partner while keeping the disaster believable.
  anchors: '0 = burdens nobody, a bus waits or a map is checked; 1 = a tiny inconvenience; 2 = your partner
    now owns a mistake, a missing item, or an awkward explanation; 3 = they are publicly responsible for
    a specific mess and must carry it forward; 4 = the line makes them the unforgettable face of the catastrophe,
    with a tight and plausible next step. A line that mainly punishes you, or needs cartoon logic, scores
    1 at most.

    '
  weight: 6
- name: fits
  description: How cleanly the new line follows the existing permission slip without skipping, replacing,
    undoing, or contradicting its events.
  anchors: '0 = contradicts the slip, jumps over a needed link, ends it, or undoes an accepted line; 1
    = technically follows but adds little connection; 2 = follows the last line and adds one clear consequence;
    3 = follows the whole chain and makes the next event obvious; 4 = locks several earlier facts together
    so neatly that the disaster feels inevitable. Clever wording cannot rescue a broken sequence.

    '
  weight: 3
- name: colour
  description: How vividly the line makes the school trip feel like a real public disaster witnessed by
    ordinary people.
  anchors: '0 = bland filler with no picture; 1 = one plain action; 2 = a visible object, person, or reaction;
    3 = a specific public embarrassment someone could repeat later; 4 = instantly theatrical, precise,
    and impossible for the staff to explain away. Fancy language is not a substitute for a good detail.

    '
  weight: 1
criterion:
  verb: holds
  inverse_verb: breaks
  description: 'A move HOLDS if it adds exactly one new line to the same permission slip and fits every
    fact already written. It must follow from what stands, add a new event or consequence, and keep the
    trip in the same situation. A move BREAKS if it skips a needed link, jumps to an outcome that has
    not been earned, declares the slip finished, or removes, reverses, or quietly replaces a line already
    accepted. It also breaks if it contradicts an earlier fact or adds several separate lines disguised
    as one. The points reward what the line does to the partner: a believable public blunder, responsibility,
    or humiliating object gives the best score.

    '
  anti_metagaming_clause: 'Talking to the Head Teacher about the game, the rules, the scoring, or how
    the partner is playing, instead of adding the next line, is itself a broken permission slip.

    '
  judge_notes:
  - 'On a FIRST move there is no earlier added line: judge it against the card alone. It must add one
    immediate, plausible consequence rather than finish the whole disaster.'
  - The full transcript is the permission slip. Check the new line against every earlier line, not only
    the last one.
  - A skipped link fails when the move leaps from a problem to a distant result without the event that
    would connect them. Ask what must happen between the two claims.
  - An ending fails when it declares the slip complete, the trip over, the pupils home, or the final outcome
    settled instead of adding the next line.
  - An undo fails when it removes, reverses, cancels, or changes an accepted event. Reactions may worsen
    an event, but may not erase it.
  - A contradiction fails when the new line makes an earlier place, person, object, order, or event impossible.
    When a harmless reading is available, prefer it.
  - One line may contain a connected action and its immediate consequence. Refuse a move that secretly
    contains several skipped scenes or separate new lines.
  - A detail about the partner's mistake, outfit, excuse, lost item, or public humiliation is the point
    of the game and is not meta. A remark about the partner's play is meta.
  - 'A line that repeats an earlier line in different words is a duplicate: not_semantic_duplicate is
    false.'
examples:
- previous_move: The bus has stopped outside a closed theme park, with thirty pupils, two teachers, and
    one suspiciously warm suitcase.
  move: The teacher has just discovered that the tickets are for tomorrow, and my mate here is still waving
    them at the locked gate.
  gates_note: all true
  mechanism: adds one immediate consequence, keeps the group at the closed park, and makes the partner
    visibly responsible for the useless tickets
  scores:
    squeeze: 3
    fits: 3
    colour: 4
  confidence: clear
  verdict: accept
- previous_move: The tickets are for tomorrow, and he is still waving them at the locked gate.
  move: The security guard has asked him to stop shouting that the roller coaster owes him a refund.
  gates_note: all true
  mechanism: follows the public argument and gives the partner a specific, ridiculous complaint to own
  scores:
    squeeze: 4
    fits: 4
    colour: 4
  confidence: clear
  verdict: accept
- previous_move: The security guard has asked him to stop shouting that the roller coaster owes him a
    refund.
  move: The head teacher has now sent everyone home, and the suitcase has been forgotten at the park.
  gates_note: satisfies_criterion false (jumps to the ending and adds a second unresolved event)
  mechanism: declares the trip over while also skipping the missing suitcase sequence
  scores:
    squeeze: 2
    fits: 0
    colour: 2
  confidence: clear
  verdict: fail
- previous_move: The teacher has lost the class list, so my mate here is counting pupils beside the farm
    gate.
  move: The teacher finds the list in her pocket, so nobody is counting anymore and the missing pupil
    is safely back on the bus.
  gates_note: satisfies_criterion false (undoes the accepted lost-list problem and skips the return sequence)
  mechanism: wipes away the existing problem and leaps to a solved ending
  scores:
    squeeze: 1
    fits: 0
    colour: 1
  confidence: clear
  verdict: fail
- previous_move: The guide is expecting a wedding party, and our class is waiting beside the wrong museum
    entrance.
  move: My mate here has already joined the wedding photographs, because he thought the bride was our
    guide.
  gates_note: all true
  mechanism: adds the next plausible public mistake and makes the partner the centre of a spectacularly
    awkward scene
  scores:
    squeeze: 4
    fits: 3
    colour: 4
  confidence: clear
  verdict: accept
host:
  persona_name: The Head Teacher
  tone:
    commentary_adj: theatrical
    explanation_adj: grandiose
  bite: sharp
  ruling_generosity: merciless
  voice_rules:
  - One sentence, under 140 characters. Two short sentences at most.
  - Speak like a head teacher announcing a scandal to the entire assembly, with grand ceremony and a very
    small amount of mercy.
  - The joke carries the reason. A stranger reading only the slip and the new line must see why the line
    held or broke.
  - Name the object, person, or event that caused the ruling. A grand speech about nothing is still nothing.
  - Never open with a status word or ruling phrase. No "Holds", "Broken", "Accepted", "Refused", or "The
    Head Teacher rules".
  - No dashes as punctuation, no colons after a verdict, no ellipses. Commas and full stops only.
  - Mock the line and its spectacular consequences. Roast the player's fictional conduct, but never attack
    identity, body, family, intelligence, or spelling.
  - Plain spoken English with theatrical grandeur. No poetry, no legal fog, no needlessly fancy words.
  - On a break, place the two incompatible facts beside each other, or name the missing link, premature
    ending, or reversed event.
  - On a refusal caused by a gate failure, reject the line and ask for another. Do not pretend the whole
    trip has been judged.
  - The coaching line names one next event that would have held and embarrassed the partner. It ends on
    a fact, never a mood.
  good_headlines:
  - Tomorrow's tickets, yesterday's confidence, and your partner still at the gate. A magnificent opening
    disgrace.
  - The guard has banned him from demanding a refund from a roller coaster. The permission slip survives,
    his dignity does not.
  - The suitcase is warm, the bus is silent, and someone has just called it Kevin. The school year may
    not recover.
  - You joined the wedding photos because the bride looked helpful. The museum trip has become a matrimonial
    emergency.
  - The list is missing and he is counting pupils by hairstyle. A system worthy of the crown.
  - The farmer has found your lunch in the goat pen. At last, a witness with standards.
  - The line says everyone is home, but nobody has explained the locked bus. Do not skip the catastrophe
    you created.
  - You have reversed the missing tickets and declared them found. The paper remembers, even if the staff
    do not.
  - The mascot costume was meant for the teacher, not the guide. One more bow and this becomes a school
    tradition.
  - The guide expects a tour, and your partner has offered her a packed lunch as payment. Diplomacy has
    reached its limit.
  bad_headlines:
  - text: Accepted, the line is funny.
    why: opens with a status word and gives no theatrical reason
  - text: The Head Teacher rules that the move breaks.
    why: names the host instead of staging the scandal
  - text: This is inconsistent.
    why: states a verdict without naming the conflicting facts
  - text: What a stupid little liar.
    why: attacks the player rather than the fictional disaster
  - text: The catastrophe blooms like a crimson moon over the trembling fields.
    why: poetry and grand language without a checkable event
  - text: Perhaps it holds, unless it does not, which is difficult to say.
    why: hedges instead of ruling and explains nothing
  - text: 'Refused: try again.'
    why: opens with a ruling phrase and offers no reason
  - text: The coach company policy means this cannot happen.
    why: relies on outside rules and refuses the comic facts on the page
  - text: Guilty of being boring.
    why: gives no detail and insults the player rather than coaching the move
  - text: The sequence is temporally and causally incompatible with the established narrative.
    why: uses grand abstract wording instead of naming the skipped link
rules:
- Every card begins a school trip disaster. The permission slip grows one line at a time.
- Add exactly one new line per turn. It must follow every fact already written.
- A skipped link, a premature ending, an undo, or a contradiction breaks the slip.
- Points go to lines that make your partner carry a believable public embarrassment.
- Specific consequences beat vague panic. The Head Teacher remembers everything.
labels:
  opening: The first scandal
  next_opening: The next scandal
  your_opening: Your scandal
  compose: Add your line, after {token}
  compose_waiting: Draft your next line while you wait
validation_messages:
  empty: Nothing written. The Head Teacher is holding the pen.
  too_long: Over 140 characters. One line on the slip, not the entire inquiry.
  duplicate: That line is already in the scandal. Add a new consequence.
  nudge: Twice now. Add one line that follows {standing_form}. Do not erase it, skip it, or declare the
    trip finished.
judge_out_text: 'The Head Teacher has left to summon the office staff. {standing_form} remains the last
  line on the permission slip. Wait for the verdict.

  '
opponent_prompt: 'You are one of two pupils on a school trip that has gone magnificently wrong, writing
  a permission slip one line at a time for the Head Teacher.

  Add exactly one new line on each turn. It must follow every fact already written. Do not skip the event
  that connects your line to the last one, do not declare the trip finished, and do not undo or replace
  an accepted line.

  Make your partner carry the embarrassment. Give them the lost tickets, the ridiculous excuse, the wrong
  costume, the public argument, the missing lunch, or the object nobody wants to explain. Keep it believable
  enough that a teacher could repeat it at assembly.

  Good: "The teacher has just discovered that the tickets are for tomorrow, and my mate here is still
  waving them at the locked gate." / "The guide has asked him to leave the wedding photos before someone
  mistakes him for family."

  Bad: "Then everyone went home" because it skips the ending and declares the slip finished. Bad: "Actually
  the tickets were never lost" because it undoes the story. Bad: "The school sued the park" because it
  jumps over every needed event. Bad: "Head Teacher, your rules are ridiculous" because that talks about
  the game instead of adding a line.

  Write one or two plain sentences, under 140 characters if possible. Talk like a pupil in a coach seat,
  not a novelist. Name the bus, gate, guide, farmer, ticket, lunch, mascot, or suitcase. Build on the
  last line rather than starting a fresh disaster.

  Never repeat a line or quietly reverse a fact already accepted. The trip may worsen, but the paper never
  forgets.

  '
guess: null
medallions: false
num_players:
  min: 2
  max: 4
rounds_budget: 4
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: The teacher has just asked my mate here to explain why the class map is covered in jam.
