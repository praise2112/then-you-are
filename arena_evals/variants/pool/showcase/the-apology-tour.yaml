schema_version: 1
slug: the-apology-tour
title: Sorry About the Gift
tagline: Thank them warmly. Blame the present.
emblem: 💌
accent: '#7a3f58'
premise: 'A thank-you note nobody wanted to write becomes an apology nobody asked for. You must thank
  the giver while making the unwanted gift sound like the cause of a tiny personal disaster. The host
  scores the distance between the plain fact and your excuse-riddled masterpiece.

  '
mode: showcase
seed_recipe:
  card_shape: sentence
  max_words: 15
  axes:
    giver:
    - Nora
    - Leo
    - Mina
    - Uncle Ray
    - Priya
    - Sam
    - Jules
    - the neighbour
    gift:
    - a hat
    - a mug
    - a toy
    - a scarf
    - a lamp
    - a book
    - a vase
    - a clock
    defect:
    - two sizes too small
    - far too loud
    - with a cracked handle
    - covered in glitter
    - missing one button
    - with a strange smell
    - that leaks everywhere
    - that plays one song
  tests:
  - One plain sentence, past tense, under sixty characters. A stranger sees the giver, receiver and gift
    at once.
  - Nobody is dead, robbed, sacked or seriously ill. No real people, brands or place names.
  - It feels like a gift someone could actually hand over, followed by a problem someone could politely
    hide.
  - It names a giver, a receiver and a specific gift with one awkward detail.
  - The defect gives the note something to apologise for without turning the card into a full story.
demo:
