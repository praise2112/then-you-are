    funny: 2
    headline_shaped: 3
  confidence: clear
  verdict: fail
- previous_move: Count escaped chickens at a farm gate.
  move: A natural leader who should be promoted to nightclub security.
  gates_note: satisfies_criterion false (it recommends different work and drops the chicken counting)
  mechanism: the applicant is given a new career, not recommended for counting escaped chickens
  scores:
