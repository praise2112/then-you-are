    emoji: 🔒
    scores:
      stretch: 3
      funny: 3
      headline_shaped: 4
  headline: The umbrella duty remains, and so does the unexplained moisture in the applicant's file.
  openings:
  - token: Stand outside a nightclub and hold umbrellas for strangers in the rain.
    examples:
    - Punctual, discreet, and has never asked what was in the umbrellas.
  - token: Count escaped chickens at a farm gate.
    examples:
    - Punctual, discreet, and has never asked what was in the umbrellas.
move_constraints:
  max_chars: 90
  prefix: ''
  example: Reliable, discreet, and has never asked what was in the bin.
  hint: One reference sentence. Recommend the applicant, then reveal why the job should terrify us.
rubric:
- name: stretch
  description: How far does the reference turn a grim little job into a personal catastrophe while still
    recommending the applicant for it?
  anchors: '0 = repeats the job with no angle; 1 = adds one mild compliment; 2 = gives a strange skill,
    motive or warning; 3 = invents a full history of disgrace, danger or devotion while the applicant
    still suits the job; 4 = a devastating character reference that makes the vacancy feel like evidence
    in a trial, yet still recommends the applicant without blinking (rare).

    '
  weight: 5
- name: funny
  description: Does the former boss's praise create a clean comic hit?
  anchors: '0 = flat; 1 = a small twitch; 2 = a smile at the applicant''s expense; 3 = a proper laugh;
    4 = a sentence the room repeats because the recommendation is worse than the job (rare). Grim sincerity
    usually beats a wink.

    '
  weight: 4
- name: headline_shaped
  description: Does it work as one crisp reference sentence, with praise doing the damage?
  anchors: '0 = not a reference, an explanation or a paragraph; 1 = a recommendation buried under padding;
    2 = recognisable but loose; 3 = compact, grammatical and clearly from a former boss; 4 = every word
    sounds useful until the final implication arrives (rare).

    '
  weight: 2
criterion:
  verb: keeps the fact inside
  inverse_verb: loses the fact of
  description: 'A reference PLAYS if a reader who knows only the reference can still understand that the
    applicant is suitable and willing to perform the card''s stated job. The job may be made filthy, sinister,
    humiliating or absurd, but it must remain the job. The sentence fails when it drops the work entirely,
    makes the applicant unwilling or unsuitable, replaces the task with another one, or becomes a comment
    about the game rather than a reference. A plain recommendation that merely repeats the card plays
    and scores near zero on stretch.

    '
  anti_metagaming_clause: 'Speaking to the Host, discussing the round or explaining the scoring is not
    a reference and loses the move.

    '
  judge_notes:
  - 'Test the first move by asking whether a stranger can identify both the work and the applicant''s
    willingness to do it. "Punctual, fearless, and already knows every chicken by its alias" passes for
    counting escaped chickens because the task remains clear and the applicant sounds ready.

    '
  - 'Dropping the job fails. "A troubled soul who should never be left alone with a clipboard" is not
    enough for holding umbrellas outside a nightclub because no work survives.

    '
  - 'Refusing the work fails. "Brilliant, but she will not stand in the rain" contradicts a job requiring
    the applicant to stand in the rain.

    '
  - 'Unsuitability fails. "A perfect umbrella holder, provided he is never near an umbrella" breaks the
    stated task rather than recommending the applicant for it.

    '
  - 'Replacing the task fails. "He would make an excellent bouncer" does not recommend someone to hold
    umbrellas, even if a nightclub appears in the card.

    '
  - 'Invented detail is allowed when it supports the recommendation. A criminal record, a secret romance,
    a vendetta against poultry or a disturbing level of stamina may all play if the applicant still does
    the stated work.

    '
  - 'Both players answer the same card. Judge each reference on its own; the other player''s sentence
    is not the standard.

    '
  - 'Score stretch by distance from the job, not by cruelty alone. A surgical reference that turns umbrella
    duty into a rain soaked custody dispute beats a loud insult with no work in it.

    '
  - 'Lower case, capitals, a missing full stop and ordinary spelling do not matter. The words and their
    meaning do.

    '
