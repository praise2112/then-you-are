schema_version: 1
slug: reference-check-from-hell
title: Reference Check from Hell
tagline: Recommend the ruin. Seal the fate.
emblem: 🖋️
accent: '#5b315f'
premise: 'Three rounds. Each round deals one job nobody wants, described by a dull fact about its work.
  Both players write one sentence from a former boss recommending the applicant. The work must remain
  recognisable, and the sentence must still make the applicant suitable and willing to do it. Everything
  else is fair game: grudges, secret talents, warnings, crimes, romance, bodily fluids and the precise
  reason nobody else applied. The Host scores how strangely the reference recommends the doomed applicant
  while the job still stands.

  '
mode: showcase
seed_recipe:
  card_shape: sentence
  max_words: 14
  axes:
    setting:
    - a nightclub entrance
    - a farm gate
    - a public toilet
    - a wedding venue
    - a motorway lay-by
    - a petting zoo
    - a hospital corridor
    - a football changing room
    task:
    - hold umbrellas for strangers
    - count escaped chickens
    - scrub abandoned costumes
    - guard a pile of wet coats
    - announce missing dentures
    - sort socks from a lost property bin
    - calm queueing pensioners
    - remove chewing gum from seats
    ordeal:
    - in the rain
    - after midnight
    - during a heatwave
    - while wearing borrowed shoes
    - beside a broken loudspeaker
    - under constant supervision
    - with no chair provided
    - until the final customer leaves
  tests:
  - One plain sentence, past or present tense, under fifteen words. A stranger sees the job at once.
  - Nobody is murdered, seriously injured or forced into sexual activity. The misery is comic and workplace-sized.
  - It describes work a person could actually be hired to do, however vile, pointless or socially cursed.
  - It contains a setting and a task, with at least one noun a reference can turn into a witness, weapon
    or scandal.
  - It names one checkable ordeal, such as rain, a time, a number or a missing object, that a reference
    can keep or twist without erasing.
demo:
