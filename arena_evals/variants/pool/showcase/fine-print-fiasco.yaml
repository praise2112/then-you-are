schema_version: 1
slug: fine-print-fiasco
title: Fine-Print Fiasco
tagline: The law is harmless until someone reads the footnote.
emblem: ⚖️
accent: '#6b4c9a'
premise: 'Three rounds. Each round names a plausible law for a real country. Both players write one mock
  legal notice under 90 characters, preserving the rule while adding a legal exception, demand or consequence
  that makes it dramatically worse. The rule must survive, but the fine print may ruin everyone''s day.
  The Clerk scores how far each notice travels from the harmless rule while remaining legally compatible.

  '
mode: showcase
seed_recipe:
  card_shape: sentence
  max_words: 15
  axes:
    country:
    - France
    - Germany
    - Japan
    - Norway
    - Italy
    - Australia
    - Canada
    - Spain
    rule:
    - workers may disconnect from emails
    - shops close on Sunday
    - employees take a health check
    - tenants receive written notice
    - drivers carry a warning triangle
    - parents register a newborn
    - riders wear a bicycle helmet
    - businesses display opening hours
    legal_scope:
    - by law
    - under national rules
    - unless exempted
    - with written notice
    - during official hours
    - for public safety
    - subject to local approval
    - where the statute applies
  tests:
  - One sentence, under sixty characters where possible, naming a real country and a plausible ordinary
    rule.
  - The rule is harmless on its face. Nobody is hurt, hunted, jailed or made ill by the card itself.
  - It sounds like something a government could regulate, not a rumour, a custom or a joke dressed as
    law.
  - It contains a clear action or entitlement a legal notice can preserve while making the fine print
    worse.
  - A stranger can tell exactly what remains true after reading the card once.
demo:
  opening:
    token: In France, workers have a legal right to disconnect from work emails.
    emoji: 📵
  moves:
  - actor: p1
    text: In France, workers have a legal right to disconnect from work emails.
