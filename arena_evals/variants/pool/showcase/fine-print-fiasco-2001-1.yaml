schema_version: 1
slug: fine-print-fiasco-2001-1
title: Fine Print Fiasco
tagline: Tiny rules for perfectly harmless things.
emblem: 🧾
accent: '#6f8f80'
premise: 'Three rounds. Each round deals one harmless everyday thing. Both players write one strange fine
  print rule that could honestly belong with it. The Judge scores each rule for how believable, funny,
  and neatly written it is. Then each player sees the other''s rule beside the real house rule and calls
  which one was invented. Read carefully; the loophole is wearing a tiny hat.

  '
mode: showcase
seed_recipe:
  card_shape: short_form
  max_words: 2
  axes:
    object:
    - umbrella
    - backpack
    - wooden spoon
    - mug
    - scarf
    - pillow
    - bicycle bell
    - lunchbox
    risk:
    - crushing
    - spilling
    - misplacing
    - overheating
    - startling
    - tangling
    - staining
    - sharing
    setting:
    - indoors
    - on public transport
    - at breakfast
    - in the rain
    - near a pet
    - during travel
    - at work
    - before bedtime
  tests:
  - The card names a harmless everyday thing.
  - The thing can naturally have a warning label or condition of use.
  - The card is a noun phrase with an article.
  - The wording is clear without extra explanation.
  - The thing invites a strange but plausible restriction.
demo:
  opening:
    token: umbrella
    emoji: ☂️
  moves:
  - actor: p1
    text: umbrella
    emoji: ☂️
    scores: null
