schema_version: 1
slug: double-feature-damage
title: Double-Feature Damage
tagline: Two nouns enter. One tiny festival leaves with a poster.
emblem: 🎬
accent: '#c45b4b'
premise: 'Three rounds. Each round gives you two plain nouns. Turn both into a film title and a tagline
  for a small event, making the pairing feel unexpectedly ambitious rather than merely accurate. The Judge
  scores the pitch, then each player calls which entry better preserves the card''s connection. The winning
  pitch gets the room, the other gets the poster nobody approved.

  '
mode: showcase
seed_recipe:
  card_shape: short_form
  max_words: 3
  axes:
    noun_pair_type:
    - object and weather
    - food and emotion
    - animal and bureaucracy
    - body part and landscape
    - household item and crime
    - profession and dessert
    - musical instrument and illness
    - transport and superstition
    event_scale:
    - one room
    - a borrowed hall
    - a back garden
    - a village cinema
    - a pub side room
    - a library basement
    - a school gym
    - a rooftop gathering
    film_mode:
    - melodrama
    - mockumentary
    - horror
    - romance
    - courtroom drama
    - nature documentary
    - musical
    - heist film
  tests:
  - Both nouns can be recognized in the title, tagline, or their combined premise.
  - The pairing suggests a film and a small event rather than a product, slogan, or random joke.
  - The event could plausibly happen with a modest budget and a few willing adults.
  - The pitch adds an unexpected ambition without making either noun decorative.
  - The title and tagline together form one clear, playable idea.
demo:
  opening:
    token: shoe / moon
    emoji: 👟
  moves:
  - actor: p1
    text: shoe / moon
    emoji: 👟
