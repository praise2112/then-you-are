schema_version: 1
slug: ancient-meaning
title: Ancient Meaning
tagline: Make the nonsense look ancestral.
emblem: 🏺
accent: '#80643f'
premise: 'A fake proverb arrives wearing a dusty beard and pretending to explain the world. Give it a
  concrete scene that makes its strange wisdom look true, while the Host clinically tests whether both
  key nouns still matter. The best answer sounds like a proverb just discovered in a cracked temple wall.

  '
mode: showcase
seed_recipe:
  card_shape: sentence
  max_words: 8
  axes:
    subject:
    - a borrowed ladder
    - a patient spoon
    - a nervous candle
    - a jealous bucket
    - a tired bell
    - a secret umbrella
    - a proud shovel
    - a lonely key
    verb:
    - insults
    - outlives
    - distrusts
    - avoids
    - remembers
    - betrays
    - fears
    - summons
    object:
    - the sky
    - the soup
    - the wind
    - the rain
    - the moon
    - the doorway
    - the well
    - the shadow
  tests:
  - One short sentence, under eight words, with an article and two concrete nouns. It sounds like an object
    lesson from nowhere.
  - The grammar is clear enough to stage, but the relationship is odd enough to need rescuing.
  - Both key nouns can appear in a believable scene without becoming abstract ideas or decorative wallpaper.
  - No person, brand, place name, medical crisis, or political claim is required to make the proverb interesting.
  - Read aloud, it has the dusty certainty of old wisdom and the faint smell of a modern writer making
    trouble.
demo:
  opening:
    token: A borrowed ladder insults the sky.
    emoji: 🪜
  moves:
  - actor: p1
    text: A borrowed ladder insults the sky.
    emoji: 🪜
