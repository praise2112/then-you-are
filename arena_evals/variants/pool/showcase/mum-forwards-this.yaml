schema_version: 1
slug: mum-forwards-this
title: Mum Forwards This
tagline: Please share. The bus is different.
emblem: 📱
accent: '#6b4f9b'
premise: 'Three rounds. Each round gives you one plain news fact. Turn it into a message Mum would forward
  to the whole family, complete with urgent advice, suspicious sources, dire warnings and entirely invented
  concern. The exact news outcome must survive. The more chain-message panic you add without breaking
  it, the more the Family Group scores.

  '
mode: showcase
seed_recipe:
  card_shape: sentence
  max_words: 9
  axes:
    subject:
    - a bus company
    - a bakery
    - the library
    - a council
    - a supermarket
    - a railway operator
    - a school
    - a swimming pool
    event:
    - changed one route
    - opened one branch
    - added six books
    - closed one entrance
    - installed new lights
    - moved one stop
    - extended its hours
    - repainted one room
    place:
    - on High Street
    - near the station
    - in the town centre
    - by the market
    - beside the park
    - on the north side
    - near the hospital
    - at the old depot
  tests:
  - One short sentence, under ten words. A stranger understands the event at once.
  - Nothing is tragic, criminal, medical or politically explosive. It is news only because somebody noticed.
  - It contains a checkable outcome that a forwarded message can keep exactly.
  - It has an ordinary subject and an ordinary action, with no hidden joke already doing the work.
  - It is dull enough that Mum could begin with PLEASE SHARE and still improve it.
demo:
  opening:
    token: A bus company has changed one route.
    emoji: 🚌
  moves:
  - actor: p1
    text: A bus company has changed one route.
    emoji: 🚌
    scores: null
  - actor: p2
    text: 'PLEASE SHARE: BUS 14 HAS MOVED, TELL NAN BEFORE SHE BOARDS'
    emoji: 🔒
    scores:
      stretch: 3
      funny: 3
      headline_shaped: 4
  headline: The bus route changed, and Auntie has already convened the evacuation committee.
  openings:
  - token: A bus company has changed one route.
    examples:
    - 'PLEASE SHARE: BUS 14 HAS MOVED, TELL NAN BEFORE SHE BOARDS'
  - token: A bakery opened on High Street.
    examples:
    - 'PLEASE SHARE: BUS 14 HAS MOVED, TELL NAN BEFORE SHE BOARDS'
move_constraints:
  max_chars: 90
  prefix: ''
  example: 'PLEASE SHARE: THE BUS IS DIFFERENT NOW, PLAN AHEAD'
  hint: One forwarded message. Keep the news true, then add the family emergency.
rubric:
- name: stretch
  description: How far does the message travel from plain reporting into chain-message panic while the
    exact outcome remains true?
  anchors: '0 = repeats the card with no spin; 1 = adds one mild warning; 2 = invents a concern, instruction
    or suspicious angle; 3 = creates a full family emergency around the small fact; 4 = achieves majestic
    viral panic while every factual hinge still holds, rare.

    '
  weight: 6
- name: funny
  description: Does the message make its borrowed urgency absurdly entertaining?
  anchors: '0 = no comic charge; 1 = a small twitch; 2 = a clear smile; 3 = a proper laugh; 4 = worthy
    of forwarding to the group chat despite oneself, rare. Earnest panic beats a wink.

    '
  weight: 3
- name: headline_shaped
  description: Does it look and sound like a forwarded message, brief, urgent and ready to inflict itself
    on relatives?
  anchors: '0 = explanation or ordinary sentence; 1 = vague message with loose wording; 2 = recognisable
    forward with spare parts; 3 = tight, urgent and instantly shareable; 4 = one tap from becoming family
    law, rare.

    '
  weight: 1
criterion:
  verb: keeps the fact inside
  inverse_verb: loses the fact of
  description: 'A message PLAYS if a reader who knows only the message can still read the card’s exact
    real-world outcome as true. The warning, advice, source, prayer, consequence and family drama may
    be invented. It fails when the outcome is dropped, contradicted or overwritten, or when the text is
    not a forwarded-style message but a comment, a question to the Judge or a sentence about the game.
    A plain restatement plays and scores near zero on stretch.

    '
  anti_metagaming_clause: 'Speaking to the Judge, about the game or about the rules is itself a losing
    forward.

    '
  judge_notes:
  - 'Test the gate one way only: could the card’s outcome be true given this message? "PLEASE SHARE: THE
    HIGH STREET BAKERY IS OPEN" passes for a bakery that opened there. Do not ask whether the warning
    is sensible, likely or tasteful. Ask whether the card remains true.

    '
  - 'The first move must preserve the card’s exact outcome. A changed bus route must remain changed, not
    merely a bus being late; six new books must remain six new books, not a library becoming enormous.

    '
  - 'Invented warnings, advice, sources and consequences do not contradict the card unless they replace
    its outcome. "Bring cash" for an open bakery is invented and plays. "The bakery never opened" fails.

    '
  - 'Both players answer the same card. Judge each message alone; the other player is not the standard.

    '
  - 'Score stretch by distance from the card, not by the number of capital letters or alarm marks. A quiet
    line about a family evacuation can beat a louder line saying only URGENT.

    '
  - 'Lower case, capitals, missing punctuation and a lack of emojis cost nothing. Judge the words and
    the preserved outcome.

    '
examples:
- previous_move: A bus company has changed one route.
  move: 'PLEASE SHARE: BUS 14 HAS MOVED, TELL NAN BEFORE SHE BOARDS'
  gates_note: all true
  mechanism: the route change remains clear while the family is placed under a modest transport emergency
  scores:
    stretch: 3
    funny: 3
    headline_shaped: 4
  confidence: clear
  verdict: accept
- previous_move: A bakery opened on High Street.
  move: 'URGENT: HIGH STREET BAKERY OPEN, BRING CASH AND EMOTIONAL SUPPORT'
  gates_note: all true
  mechanism: the opening survives while bread becomes a crisis requiring funds and comfort
  scores:
    stretch: 3
    funny: 3
    headline_shaped: 4
  confidence: clear
  verdict: accept
- previous_move: The library added six new books.
  move: 'PLEASE SHARE: SIX NEW BOOKS AT LIBRARY, DO NOT LET THEM CHANGE YOU'
  gates_note: all true
  mechanism: six additions remain intact and acquire a suspicious moral dimension
  scores:
    stretch: 4
    funny: 4
    headline_shaped: 4
  confidence: clear
  verdict: accept
- previous_move: A bus company has changed one route.
  move: 'PLEASE SHARE: THE BUS COMPANY IS FINISHED'
  gates_note: satisfies_criterion false (a changed route has become a claim that the company is finished)
  mechanism: the message drops the exact route change and replaces it with an unsupported collapse
  scores:
    stretch: 2
    funny: 2
    headline_shaped: 3
  confidence: clear
  verdict: fail
- previous_move: A bakery opened on High Street.
  move: 'WARNING: HIGH STREET BAKERY HAS NOT OPENED, STAY HOME'
  gates_note: satisfies_criterion false (the message contradicts the bakery opening)
  mechanism: the warning flips the card’s outcome
  scores:
    stretch: 2
    funny: 2
    headline_shaped: 3
  confidence: clear
  verdict: fail
host:
  persona_name: Auntie Brenda
  tone:
    commentary_adj: ceremonial
    explanation_adj: clinical
  bite: playful
  ruling_generosity: merciful
  voice_rules:
  - Speak as though announcing a minor household decree before the assembled family.
  - Use one sentence under 140 characters, or two short sentences at most.
  - Let the joke carry the explanation. A stranger must see which ordinary fact has been dressed for apocalypse.
  - Name the message’s key object, the bus, loaf, book or route. A general remark is a medical chart with
    the patient removed.
  - Never open with a status word or ruling phrase. Do not begin with Accepted, Rejected, Refused, Move
    refused or The Judge refuses.
  - Use commas and full stops only. No dashes as punctuation, no colons after a verdict and no ellipses.
  - Roast the message and its melodrama, never identity or protected traits. A gentle jab at the sender’s
    panic is permitted; cruelty is not.
  - On a fail, state which exact outcome vanished, changed or was contradicted, using the card’s own plain
    words.
  - On a refusal, name the gate failure and request another forward. Do not announce a winner.
  - The coaching line names one message that would have played. It ends on an action or fact, never a
    mood or verdict.
  good_headlines:
  - The bus route changed, and Auntie has already convened the evacuation committee.
  - Six books arrived and somehow became a literacy scandal with a dress code.
  - The bakery opened on High Street. The emotional support is excessive, but the bread is present.
  - The message kept the route and added enough panic to make Nan miss it anyway.
  - A changed bus route has been promoted to a family decree, with the bus still changed.
  - The bakery is open, the cash advice is invented, and the croissants remain legally available.
  - Six new books are six new books, though this forward treats them like a cult recruitment drive.
  - The library gained paper and the family gained a warning. Both outcomes survive inspection.
  - Auntie has discovered the word URGENT and used it to escort a perfectly innocent loaf into public
    danger.
  - The route is changed, the warning is theatrical, and the family group has received its morning summons.
  bad_headlines:
  - text: 'Accepted: a splendid little panic.'
    why: opens with a status word
  - text: 'The Judge refuses: the bus has vanished.'
    why: opens with a ruling phrase and names the host
  - text: Move refused, forward another message.
    why: opens with a ruling phrase
  - text: Incorrect, the fact is missing.
    why: does not say which fact went missing
  - text: A magnificent effort.
    why: offers no reason and could fit any message
  - text: Only a fool would forward that.
    why: roasts the player instead of the message
  - text: O sacred loaf, arise and feed the trembling multitudes.
    why: uses ornate poetry instead of plain spoken English
  - text: Urgent, alarming, catastrophic, apocalyptic, unprecedented.
    why: stacks adjectives without a concrete picture
  - text: Better than the other player’s panic.
    why: judges the pair rather than this message
  - text: The chain-message payload has achieved maximum virality.
    why: uses technical and platform jargon
rules:
- Three rounds, one plain news fact each.
- Write one forwarded-style message under 90 characters. The House writes its own, unseen, and Auntie
  Brenda scores both.
- The exact real-world outcome must remain true to a reader who sees only your message. Drop it, reverse
  it or overwrite it and the round is lost.
- Warnings, advice, sources, prayers, costs and family drama are yours to invent. The further you travel
  from the plain fact while it survives, the more you score. Most points after three rounds wins.
labels:
  opening: The news
  next_opening: The next news
  your_opening: Your news
  compose: Your forward for {token}
  compose_waiting: Compose your forward while you wait
validation_messages:
  empty: No message received. Forward something.
  too_long: Over 90 characters. This is a forward, not a family newsletter.
  duplicate: That message has already circulated this match. Find another panic.
  nudge: 'Twice now. One forward that keeps this true: {standing_form}'
judge_out_text: 'Auntie Brenda has stepped away from the family group. Nobody forwards anything until
  she returns. {standing_form} sits unread. Give it a moment.

  '
opponent_prompt: 'You are composing a message your mum would forward to the whole family after reading
  a dull news fact. Write one forwarded-style text.

  THE FACT MUST SURVIVE. A reader who sees only your message must still be able to read the card’s exact
  real-world outcome as true. Never drop it, reverse it or overwrite it. A changed bus route remains changed.
  A bakery that opened remains open. Six added books remain six added books.

  Then add maximum chain-message panic. Invent the warning, advice, source, prayer, cost, family drama
  or suspicious consequence. The points reward distance from the plain report while the report remains
  true.

  Good: "PLEASE SHARE: THE HIGH STREET BAKERY IS OPEN, BRING CASH AND EMOTIONAL SUPPORT". "URGENT: SIX
  NEW LIBRARY BOOKS, DO NOT LET THEM CHANGE YOU". "TELL NAN THE BUS ROUTE MOVED, SHE HAS TEN MINUTES".

  Bad: "THE BUS COMPANY IS FINISHED" because the route change vanished. "THE BAKERY HAS NOT OPENED" because
  the outcome is reversed. "SIX BOOKS DESTROY SOCIETY" because the exact addition is overwritten. "SHOCKING
  NEWS" because it contains no fact.

  Use forward rhythm, short plain words and urgent language. Under 90 characters. Capitals are fine. Do
  not use a colon or a dash. Do not explain the joke.

  Vary the panic from round to round: practical warning, family instruction, suspicious source, moral
  alarm, financial advice. Never use identity-based abuse. No quotation marks around the message. Reply
  with the message only.

  '
guess: null
medallions: false
num_players:
  min: 2
  max: 6
rounds_budget: 3
win_condition: points_total
tie_policy: draw
strikes_before_consequence: 2
default_move: 'PLEASE SHARE: ORDINARY NEWS MAY AFFECT THE WHOLE FAMILY'
seed_pool:
  - { opening_token: "A bus company has changed one route.", opening_emoji: "🚌" }
  - { opening_token: "A bakery opened on High Street.", opening_emoji: "🥖" }
  - { opening_token: "The library added six new books.", opening_emoji: "📚" }
