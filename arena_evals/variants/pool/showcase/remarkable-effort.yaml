  - { opening_token: "He returns my stapler before class.", opening_emoji: "📎" }
  - { opening_token: "She hands back the whiteboard marker before class.", opening_emoji: "🖊️" }
  - { opening_token: "They bring back borrowed textbooks before class starts.", opening_emoji: "📚" }
  - { opening_token: "She labels the lunchbox contents.", opening_emoji: "🏷️" }
  - { opening_token: "He wraps the sandwich in parchment.", opening_emoji: "🥪" }
  - { opening_token: "She stacks the containers by size.", opening_emoji: "📚" }
  - { opening_token: "She checks the door after each lesson.", opening_emoji: "🚪" }
  - { opening_token: "She uses the stairs near the front.", opening_emoji: "🏃‍♀️" }
