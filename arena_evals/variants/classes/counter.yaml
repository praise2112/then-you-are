name: counter
examples: [then-i-am]
cells: 27

fixed:
  - mode
  - win_condition
  - tie_policy
  - rounds_budget
  - num_players
  - strikes_before_consequence
  - guess
  - criterion.verb
  - criterion.inverse_verb
  - move_constraints.max_chars

varies:
  - slug
  - title
  - tagline
  - emblem
  - accent
  - premise
  - rules
  - labels
  - criterion.description
  - criterion.anti_metagaming_clause
  - criterion.judge_notes
  - rubric descriptions and anchors, names and order kept from the example
  - examples
  - move_constraints.prefix, example and hint
  - seed_recipe
  - seed_pool, three placeholder seeds from the example until the pool is grown
  - demo
  - host.persona_name, voice_rules, good_headlines, bad_headlines
  - validation_messages
  - judge_out_text
  - opponent_prompt
  - default_move

axes:
  theme:
    - the kitchen
    - the playground
    - the open-plan office
    - weather and the seasons
    - the farmyard
    - the toolbox and the shed
    - folklore, monsters and charms
    - the football pitch
    - the back garden
    - the sea and the shore
    - paperwork and the council
    - the school corridor
    - the building site
    - the hospital ward
    - the high street
    - the circus
    - the zoo after closing
    - the road and the traffic
    - the bathroom
    - a wedding
    - the pub
    - the launderette
    - plumbing and pipes
    - the group chat
    - a medieval castle
    - the theatre
    - a campsite
    - the airport
    - ghosts and hauntings
    - the human body
    - insects and small things
    - the post office
  voice:
    - { commentary_adj: witty, explanation_adj: snarky, bite: sharp, ruling_generosity: fair }
    - { commentary_adj: deadpan, explanation_adj: plain, bite: playful, ruling_generosity: fair }
    - { commentary_adj: grandiose, explanation_adj: theatrical, bite: sharp, ruling_generosity: merciless }
    - { commentary_adj: world-weary, explanation_adj: dry, bite: playful, ruling_generosity: merciful }
    - { commentary_adj: menacing, explanation_adj: clinical, bite: savage, ruling_generosity: merciless }
  content_rating: { family: 1, mild: 2, edgy: 3 }
  family_excludes:
    bite: [savage]
    explanation_adj: [snarky, menacing]
  weights:
    - [5, 3, 2]
    - [5, 4, 2]
    - [4, 3, 2]
    - [6, 3, 1]

sabotage_expectations:
  near_duplicate: semantic_reject
  verbosity: same_as_source
  injection: semantic_reject
  meta: semantic_reject
  amplification: fail
  off_topic: semantic_reject
  weak_but_legal: accept

tests:
  - A stranger reads the premise and wants to play the first move now. Never a game that needs explaining twice.
  - Each move is one standing thing that acts on the thing before it. A stranger can say in one sentence how it beats what stands.
  - The criterion names what counts as beating and what does not. Dodging, surviving and a bigger copy of the standing thing are named as losses.
  - The theme gives at least twenty things a twelve-year-old can name that beat each other in plain ways.
  - The judge notes cover the first move, the bigger copy, the cousin from the same family, and the figure of speech offered as a mechanism.
  - The host mocks the losing move and never the player, at every content rating.
