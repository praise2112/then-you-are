schema_version: 1
slug: domino
title: Domino
emblem: "⛓️"
accent: "#0f766e"
tagline: "Make it worse, one step at a time."
mode: escalation
premise: >
  One small thing goes wrong. Two players take turns saying what happens next, one
  step at a time, and the mess gets bigger. The Judge checks that every step follows
  from the last. Skip a link, end the story, or undo a step and the chain stops with you.

seed_pool:
  - { opening_token: "A cat knocks a candle off the shelf.", opening_emoji: "🕯️" }
  - { opening_token: "A toddler presses every button in the lift.", opening_emoji: "🛗" }
  - { opening_token: "The office printer jams five minutes before the big meeting.", opening_emoji: "🖨️" }
  - { opening_token: "A pigeon gets into the supermarket.", opening_emoji: "🐦" }
  - { opening_token: "Someone leaves the garden gate open.", opening_emoji: "🚪" }
  - { opening_token: "A phone rings during the wedding vows.", opening_emoji: "📱" }
  - { opening_token: "The ice cream van breaks down outside the school at home time.", opening_emoji: "🍦" }
  - { opening_token: "A bee flies in through the bus window.", opening_emoji: "🐝" }
  - { opening_token: "The dog steals a sausage off the barbecue.", opening_emoji: "🌭" }
  - { opening_token: "A shopping trolley rolls off across the car park.", opening_emoji: "🛒" }
  - { opening_token: "The wifi drops in the middle of the online exam.", opening_emoji: "📶" }
  - { opening_token: "Grandad falls asleep with the bath running.", opening_emoji: "🛁" }
  - { opening_token: "A balloon escapes at the birthday party.", opening_emoji: "🎈" }
  - { opening_token: "The bride's heel snaps on the church step.", opening_emoji: "👠" }
  - { opening_token: "A seagull steals a chip on the pier.", opening_emoji: "🍟" }
  - { opening_token: "A student microwaves fish in the shared kitchen.", opening_emoji: "🐟" }
  - { opening_token: "The goalkeeper's shorts split during the penalty.", opening_emoji: "⚽" }
  - { opening_token: "Someone hits reply all on the office email.", opening_emoji: "📧" }
  - { opening_token: "A hamster gets loose in the classroom.", opening_emoji: "🐹" }
  - { opening_token: "The last bus leaves two minutes early.", opening_emoji: "🚌" }
  - { opening_token: "A pot of glitter tips over in the nursery.", opening_emoji: "✨" }
  - { opening_token: "A waiter drops one fork in a silent restaurant.", opening_emoji: "🍴" }
  - { opening_token: "The garden sprinkler comes on during the barbecue.", opening_emoji: "💦" }
  - { opening_token: "A ladder slides away from the roof.", opening_emoji: "🪜" }
