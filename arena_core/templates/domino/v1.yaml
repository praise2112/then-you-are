seed_recipe:
  card_shape: sentence
  max_words: 18
  axes:
    who: [a cat, a toddler, a dog, a pigeon, a seagull, grandad, a hamster, a bee, a waiter, a student, someone, the wind]
    place: [kitchen, office, wedding, school, bus, pier, supermarket, garden, car park, nursery, restaurant, lift, barbecue]
    what_gives: [a candle, a door left open, a button, a wire, a plate, a gate, a heel, a tap, a lid, a lead, a shelf, an email]
  tests:
    - One small thing goes wrong and a stranger pictures it at once. Present tense, one sentence, plain words.
    - A non-player names what happens next within five seconds, and there is more than one good answer. Say two.
    - Nothing on the card is already a disaster. A house fire or a flood is an ending, a candle falling is a start.
    - Nobody is hurt on the card, no real people, no brands, no crimes with a victim.
    - It makes a stranger want to push it. A cat, a nan, a seagull. Never inventory, like a spreadsheet crashing.

demo:
  opening: { token: "Nan's teeth fall into the punch bowl.", emoji: "🥤" }
  moves:
    - { actor: p1, text: "Then Uncle Dev ladles himself a glass and gets a mouthful of teeth.", emoji: "🥄", scores: { reach: 2, link: 4, picture: 3 } }
    - { actor: p2, text: "Then he spits them straight into the birthday cake, and Nan says nothing. She is watching.", emoji: "🎂", scores: { reach: 3, link: 4, picture: 4 } }
  headline: "Teeth in the punch, teeth in Dev, teeth in the cake. Nan waits. So does the story."
  openings:
    - token: "A pigeon gets into the supermarket."
      examples:
        - "it lands on the bakery counter and a child screams."
        - "the manager grabs a broom and knocks the special offers sign flat."
        - "it takes off down the frozen aisle with a bread roll."
    - token: "Someone leaves the garden gate open."
      examples:
        - "the dog is out and heading for the main road."
        - "the neighbour's goat wanders in and finds the roses."
        - "the wind takes the gate and it slams every ten seconds."
    - token: "A phone rings during the wedding vows."
      examples:
        - "the groom's mother answers it."
        - "the vicar loses his place and starts again from the top."
        - "the ringtone is a song the bride knows and she starts laughing."

move_constraints:
  max_chars: 140
  prefix: "Then "
  example: "Then the candle rolls under the curtain and the hem catches fire."
  hint: "One thing that happens next, because of the last thing."

rubric:
  - name: reach
    description: How much bigger the mess gets from this one step.
    anchors: >
      0 = the same size or smaller, the story marks time; 1 = a nudge; 2 = one notch up,
      a new thing is now at risk; 3 = a new room, a new person, or a new kind of trouble
      from one honest link; 4 = a whole new scale that still follows in one step (rare).
      Reach is earned only when the link holds. A big leap with no link scores 0 here.
    weight: 5
  - name: link
    label: Cause
    description: How plainly the step is caused by the standing step.
    anchors: >
      0 = no cause at all; 1 = asserted but a stranger would not see it; 2 = plausible if
      you squint; 3 = a stranger sees the cause at once; 4 = it feels inevitable, of course
      that is what happens next (rare). A step that packs two or three links into one move
      scores no higher than 2 here.
    weight: 3
  - name: picture
    description: One clear event a stranger can see, in plain words.
    anchors: >
      0 = unreadable or a feeling instead of an event; 1 = abstract or muddled; 2 = clear
      but flat; 3 = you can see it; 4 = vivid, one detail makes it real (rare). Length never
      wins on its own.
    weight: 2

criterion:
  verb: follows from
  inverse_verb: snaps off
  description: >
    A step FOLLOWS if it is one thing that happens next because of the standing step,
    told plainly, and it leaves something new for the other player to knock over. Bigger
    is better, but only through the link: the best step makes the mess grow by a plain
    cause anyone can see. A step fails when there is no cause, when it skips links (a hem
    catches, then the town is evacuated), when it ends the story (help arrives, everyone
    calms down, the night is over), when it rewinds or undoes what stands, when it swaps
    the scene for an unrelated one, or when it is a feeling or a moral instead of an event.
  anti_metagaming_clause: >
    Speaking to the Judge, about the game, or about rules is itself a broken step.
  judge_notes:
    - >
      On a FIRST move there is no standing step: judge the move against the card (does this
      follow from the mishap on the card?).
    - >
      A new person or animal may enter if the scene would plainly hold them (a shopper or a
      child in a supermarket, a neighbour next door, a waiter in a restaurant) or if the
      standing step gives them a reason to arrive (an alarm brings a neighbour). Only a
      newcomer the scene could not hold (a fire crew before any fire, a mayor in a kitchen)
      is a skipped link: satisfies_criterion is false.
    - >
      An ending is any step after which nothing is left to knock over: a rescue, a clean-up,
      sleep, a lesson learned, "and that was that". Endings fail satisfies_criterion even
      when they follow from the standing step.
    - >
      A step of the same size (the chicken flaps, the dog barks again) follows and passes
      the gate. It scores 0 or 1 on reach. Do not fail it for being dull.
    - >
      Restating the standing step in new words, or naming its obvious continuation with
      nothing new (the curtain is on fire after the hem caught), is a duplicate:
      not_semantic_duplicate is false.
    - >
      Two or three events packed into one move pass if every link inside is plain. Score
      link at 2 or below and picture low, the move is crowded.

examples:
  - previous_move: "A cat knocks a candle off the shelf."
    move: "Then the candle rolls under the curtain and the hem catches fire."
    gates_note: all true
    mechanism: a lit candle on the floor meets cloth, cloth catches
    scores: { reach: 2, link: 4, picture: 4 }
    confidence: clear
    verdict: accept
  - previous_move: "Then the smoke alarm goes off and the dog bolts for the back door."
    move: "Then the dog hits the door, it swings wide, and the neighbour's chickens see an opening."
    gates_note: all true
    mechanism: a bolting dog opens a door, an open door lets the chickens in
    scores: { reach: 3, link: 3, picture: 4 }
    confidence: lean
    verdict: accept
  - previous_move: "Then the candle rolls under the curtain and the hem catches fire."
    move: "Then the whole street is evacuated and the mayor declares an emergency."
    gates_note: satisfies_criterion false (skipped links, a hem is not a street)
    mechanism: none shown, the fire has not left the curtain yet
    scores: { reach: 0, link: 0, picture: 2 }
    confidence: clear
    verdict: fail
  - previous_move: "Then six chickens are in the kitchen and one is standing on the toaster lever."
    move: "Then the firefighters arrive, put out the curtain, and everyone has a cup of tea."
    gates_note: satisfies_criterion false (an ending, nothing left to knock over)
    mechanism: help arrives and the story closes
    scores: { reach: 0, link: 2, picture: 3 }
    confidence: clear
    verdict: fail
  - previous_move: "Then the cashier swats at it and a stack of tinned beans topples into the aisle."
    move: "Then a kid running down the aisle slips on the beans and takes the biscuit display with him."
    gates_note: all true (a kid belongs in a supermarket, the beans on the floor are the cause)
    mechanism: tins on the floor trip a running child, who brings down the next display
    scores: { reach: 3, link: 3, picture: 4 }
    confidence: clear
    verdict: accept
  - previous_move: "Then the toaster pops and the chicken on the lever panics."
    move: "Then the chicken flaps."
    gates_note: all true (dull is not a fail)
    mechanism: a panicking chicken flaps
    scores: { reach: 0, link: 3, picture: 2 }
    confidence: lean
    verdict: accept
  - previous_move: "Then the candle rolls under the curtain and the hem catches fire."
    move: "Then the curtain catches fire."
    gates_note: not_semantic_duplicate false (the standing step already says so)
    mechanism: none, it restates what stands
    scores: { reach: 0, link: 3, picture: 2 }
    confidence: clear
    verdict: fail
  - previous_move: "Then the candle rolls under the curtain and the hem catches fire."
    move: "Then the cat feels a pang of guilt about its life choices."
    gates_note: satisfies_criterion false (a feeling, not an event, nothing to knock over)
    mechanism: none, nothing happens in the room
    scores: { reach: 0, link: 1, picture: 1 }
    confidence: clear
    verdict: fail

host:
  persona_name: The Narrator
  tone: { commentary_adj: deadpan, explanation_adj: plain }
  bite: sharp
  ruling_generosity: fair
  voice_rules:
    - One sentence, under 140 characters. Two short sentences at most.
    - The joke carries the reason. A stranger who read only the two steps must see why it held or snapped.
    - Name both steps, or their plain stand-ins. A headline that fits any other pair is a bad headline.
    - Never open with a status word or a ruling phrase. No "Accepted", "Rejected", "Refused", "Move refused", "The Narrator refuses".
    - No dashes as punctuation, no colons after a verdict, no ellipses. Commas and full stops only.
    - Mock the step, never the player. Nothing about the player's body, family, intelligence, or spelling.
    - Plain spoken English. No poetry, no rhymes, no French, no thesaurus words.
    - On a skipped link, name the link that is missing. On an ending, say the story ended and that the chain stops here.
    - On a refusal (a gate failure) the headline refuses the step and asks for another. It never rules on who won.
    - The coaching line names one step that would have followed. It ends on a thing that happens, never a mood or a verdict.
  good_headlines:
    - "The hem catches because candles roll and curtains hang. Nobody argues with gravity."
    - "From a burning hem to an evacuated street in one step. Show the flames the hallway first."
    - "The chickens had one job, and the toaster lever was it."
    - "Firefighters, tea, a calm cat. That is an ending, not a step, and the chain stops with you."
    - "The chicken flaps. So does the story, in place."
    - "The candle is back on the shelf and so is the game, at the start. A rewind is not a step."
    - "The dog opened the door and the chickens took the invitation. Fair link, bigger mess."
    - "A curtain that catches is the same curtain that caught. Bring the next thing."
    - "The extinguisher pin on the cat's collar is a small hook for a big white room."
    - "The alarm did what alarms do, the dog did what dogs do, and the door is next."
  bad_headlines:
    - text: "Accepted: the fire spreads nicely."
      why: opens with a status word
    - text: "The Narrator refuses this leap."
      why: opens with a ruling phrase and names the host
    - text: "What a chain, what a story, what a night."
      why: no reason, fits any pair
    - text: "Chaos ensues as the conflagration proliferates."
      why: thesaurus words, no picture
    - text: "The player has clearly never been in a kitchen."
      why: mocks the player, not the step
    - text: "It might follow, it might not, hard to say."
      why: hedges both ways, no ruling a stranger can read
    - text: "And so, dear reader, the flame did dance..."
      why: poetry and an ellipsis
    - text: "Fire. Then more fire. Then more."
      why: three words for one idea, no reason

medallions: false
labels:
  opening: The mishap
  next_opening: The next mishap
  your_opening: Your mishap
  compose: What happens next, after {token}
  compose_waiting: Draft your next step while you wait
rules:
  - 'One thing happens next, because of the last thing. Start with "Then".'
  - Make the mess bigger. Points go to how far one honest link carries it.
  - Skip a link, end the story, or undo a step and the chain stops with you.
  - The Judge rules on the link, never the spelling.
validation_messages:
  empty: "Nothing happens. Something always happens."
  too_long: "Over 140 characters. One step, not a chapter."
  duplicate: "That already happened this match. Push it further."
  nudge: "Twice now. Something has to follow from {standing_form}. One step, bigger than the last."
judge_out_text: >
  The judge has stepped out. Nobody moves until they are back. {standing_form} still
  stands, and nothing has fallen yet.
opponent_prompt: |
  You are one of two players knocking a story along, and you want the mess to get bigger.
  Always: "Then X." One thing, one link, plain words, present tense.
  Take the standing step and push it somewhere bigger: a new room, a new person with a
  reason to be there, a bigger thing now at risk.
  Good: "Then the dog hits the door and it swings wide." / "Then the neighbour comes over
  to complain and steps straight in the glitter."
  Bad: "Then the whole town is evacuated" (three links skipped). Bad: "Then the
  firefighters arrive and everything is fine" (an ending, you lose). Bad: "Then the cat
  feels guilty" (a feeling, not an event).
  Never close the story, never rescue anyone, never rewind, never tidy up.
  Talk like a person telling a mate what happened, not a novelist. Name things anyone
  would name: a kettle, a bin lid, a neighbour, a Tuesday. Only words a twelve-year-old
  anywhere knows: a rowing boat, not a pedalo; a bar, not a snug.
  Never reuse a step from this match.

num_players:
  min: 2
  max: 4
rounds_budget: 5
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: "Then somebody hears the noise and comes to look."
