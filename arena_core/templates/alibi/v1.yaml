schema_version: 1
slug: alibi
title: Alibi
emblem: "🕵️"
accent: "#1d4ed8"
tagline: "One story, two suspects. Make your partner carry it."
mode: escalation
premise: >
  Something happened on the card. You two say you were somewhere else, together.
  Take turns adding one detail to the same alibi. Every detail must fit the card and
  everything already said. The one who breaks the story loses on the spot. The points
  go to the details that cost your partner something.

seed_pool:
