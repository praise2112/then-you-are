schema_version: 1
slug: word-for-word
title: Word for Word
emblem: "📖"
accent: "#7a6fa0"
tagline: "Invent the meaning. Sound like the dictionary."
mode: showcase
premise: >
  Three rounds. Each round deals one real, obscure English word with its part of
  speech and origin. Both players write a one-sentence definition that sounds true.
  The Judge, who knows the real meaning, scores each bluff. Then each player sees the
  other's bluff beside the real entry and calls which one is real. Then the truth is
  read out.

