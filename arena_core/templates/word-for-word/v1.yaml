demo:
  opening: { token: gongoozler, emoji: "🚣" }
  moves:
    - { actor: p1, text: "a shallow wooden spoon used for skimming fat from stock", emoji: "🥄" }
    - { actor: p2, text: "a person who talks at length about a subject they only half understand", emoji: "🗣️" }
  headline: "Half-knowledge gets a name, and the spoon skims nothing but its own broth."
  scores: { believable: 3, funny: 3, dictionary_shaped: 3 }
  openings:
    - token: zarf
      examples:
        - "a narrow strip of land between two fields, left unploughed"
        - "a light woollen cloak worn by desert travellers at night"
        - "the sharp intake of breath before a sneeze"
    - token: snollygoster
      examples:
        - "a small marsh bird that steals eggs from other nests"
        - "a tangle of fishing line that cannot be undone"
        - "a person who arrives at a party only when the food is served"

move_constraints:
  max_chars: 160
  prefix: ""
  example: "a small brass cup that holds a hot coffee glass"
  hint: "One sentence. Sound like the dictionary."

rubric:
  - name: believable
    description: Would a stranger who does not know the word take this for the real entry?
    anchors: >
      Score as the stranger would: you know the truth, they do not, and a bluff far from
      the truth can still score 4. 0 = obviously a joke or nonsense; 1 = a stretch;
      2 = plausible if you squint; 3 = a reader would nod and move on; 4 = you could
      not tell it from the real entry (rare).
    weight: 5
  - name: funny
    description: Does the bluff land a laugh while keeping a straight face?
    anchors: >
      0 = flat; 1 = a flicker; 2 = a smile; 3 = a laugh; 4 = a laugh that still reads
      as a definition (rare). A joke that breaks the dictionary voice can score here but
      loses on believable.
    weight: 3
  - name: dictionary_shaped
    description: Does it read like an entry, with the right part of speech, one sense, and no padding?
    anchors: >
      0 = not a definition at all; 1 = a definition buried in chatter; 2 = a definition
      with some padding; 3 = terse and in the right part of speech; 4 = clean enough to
      print (rare).
    weight: 2

criterion:
  verb: passes as
  inverse_verb: gives itself away against
  description: >
    A definition PLAYS if it offers a meaning for the dealt word, in the part of speech
    given, that a stranger could mistake for a dictionary entry. It fails when it is not
    a meaning at all (a joke about the word, a comment, a story, a sentence that
    merely uses the word) or when it ignores the part of speech (a verb defined as
    a thing). An unlikely meaning still plays and scores low on believable. Landing on
    the real meaning is not a fail: it plays, and you report truth_proximity as hit.
  anti_metagaming_clause: >
    Speaking to the Judge, about the game, or about rules is itself a losing definition.
  judge_notes:
    - >
      The real meaning is given to you. Use it to set truth_proximity: hit when the
      bluff means the same thing; near only when it names the same kind of thing for
      the same purpose (a cup holder against a saucer), never for one shared word or
      a shared domain. Otherwise none. Do not reward closeness to the truth on the
      rubric.
    - >
      Both players answer the same word. Judge each definition on its own; the other
      player's definition is not the standard.
    - >
      A hedge ("I think", "maybe", "probably") or a question mark is not the voice of an
      entry. If a meaning is still offered the move plays, but believable and
      dictionary_shaped score low. A question with no meaning in it fails.
    - >
      A bare word or short phrase that names a meaning in the right part of speech is a
      definition and plays ("sediment" for a noun). It scores low on dictionary_shaped,
      not zero on everything.

examples:
  - previous_move: "zarf (noun, from Arabic via Turkish)"
    move: "a narrow strip of land between two fields, left unploughed"
    gates_note: all true
    mechanism: a terse noun sense in the voice of an entry, nothing gives it away
    scores: { believable: 4, funny: 1, dictionary_shaped: 4 }
    confidence: clear
    verdict: accept
  - previous_move: "zarf (noun, from Arabic via Turkish)"
    move: "lol idk something turkish probably a hat"
    gates_note: satisfies_criterion false (a comment, not a meaning)
    mechanism: none, it talks about guessing instead of defining
    scores: { believable: 0, funny: 1, dictionary_shaped: 0 }
    confidence: clear
    verdict: fail
  - previous_move: "absquatulate (verb, American mock Latin)"
    move: "to sit on a low stool while shelling peas"
    gates_note: all true
    mechanism: a verb sense with a homely picture, the squat inside the word does the work
    scores: { believable: 3, funny: 3, dictionary_shaped: 3 }
    confidence: clear
    verdict: accept
  - previous_move: "absquatulate (verb, American mock Latin)"
    move: "a large flat-bottomed boat used on the Mississippi"
    gates_note: satisfies_criterion false (a noun offered for a verb)
    mechanism: none, the part of speech is ignored
    scores: { believable: 1, funny: 0, dictionary_shaped: 1 }
    confidence: clear
    verdict: fail
  - previous_move: "agelast (noun, from Greek)"
    move: "a person who does not laugh"
    gates_note: all true; truth_proximity hit
    mechanism: a plain noun sense that happens to be the real one
    scores: { believable: 4, funny: 0, dictionary_shaped: 4 }
    confidence: clear
    verdict: accept
  - previous_move: "groak (verb, from Scots)"
    move: "to make a low complaining sound, like a door in winter, or a father asked to dance, or indeed any creature so put upon by the world that words fail"
    gates_note: all true (length is free; only the character limit binds)
    mechanism: a verb sense, but three similes and a flourish break the entry voice
    scores: { believable: 2, funny: 3, dictionary_shaped: 1 }
    confidence: lean
    verdict: accept

host:
  persona_name: The Lexicographer
  tone: { commentary_adj: dry, explanation_adj: exact }
  bite: sharp
  ruling_generosity: fair
  voice_rules:
    - One sentence, under 140 characters. Two short sentences at most.
    - The joke carries the reason. A stranger who read only the word and the bluff must see why it scored.
    - Name the word, or the bluff's key noun. A headline that fits any other bluff is a bad headline.
    - Never open with a status word or a ruling phrase. No "Accepted", "Rejected", "Refused", "Move refused", "The Lexicographer refuses".
    - No dashes as punctuation, no colons after a verdict, no ellipses. Commas and full stops only.
    - Mock the bluff, never the player. Nothing about the player's body, family, intelligence, or spelling.
    - Plain spoken English. No poetry, no rhymes, no French, no thesaurus words.
    - Never reveal or hint at the real meaning in the headline. The reveal is a separate beat.
    - On a refusal (a gate failure) the headline refuses the move and asks for another. It never rules on who won.
    - The coaching line names one bluff that would have scored. It ends on a fact or an action, never a mood or a verdict.
  good_headlines:
    - "The unploughed strip would fool a farmer, and the farmer would fool nobody."
    - "A stool for shelling peas. The word squats, the bluff sits, the Judge nods."
    - "Three similes for one groan, and the dictionary has room for none of them."
    - "A hat, probably, is a guess wearing a hat. Bring a definition."
    - "The marsh bird steals eggs and, very nearly, the round."
    - "Half-knowledge gets a name, and the spoon skims nothing but its own broth."
    - "The flat-bottomed boat is a fine noun for a verb that asked for legs."
    - "Nobody has ever needed a word for that, which is why this one almost works."
    - "The cloak is warm, the sentence is tidy, and the stranger is fooled."
    - "A marsh, a bird, an egg, a crime. Four nouns doing the work of one."
  bad_headlines:
    - text: "Accepted: the unploughed strip is a fine bluff."
      why: opens with a status word
    - text: "The Lexicographer refuses: that is not a definition."
      why: opens with a ruling phrase and names the host
    - text: "Move refused, try defining the word instead."
      why: opens with a ruling phrase
    - text: "Close, but a zarf is really a coffee cup holder."
      why: reveals the truth in the headline
    - text: "Believable."
      why: no reason, fits any bluff
    - text: "A brave attempt from someone who clearly cannot spell."
      why: mocks the player, not the bluff
    - text: "O word, what meanings hast thou hid beneath thy Turkish veil?"
      why: poetry
    - text: "It is plausible, credible, believable, and convincing."
      why: four words for one idea, no picture
    - text: "Better than the other player's answer this round."
      why: judges the pair, not the bluff on its own
    - text: "Nice one."
      why: no reason, no word, no bluff

rules_text: >
  Three words, three rounds. Each word is real and obscure. Write one sentence that
  could sit under it in a dictionary. Match the part of speech. The House writes its
  own bluff at the same time, and neither of you sees the other's until the Judge has
  scored both. Then you see the House's bluff beside the real entry and call which is
  real. Call it right and the points are yours. Fall for the bluff and they go to the
  House. Then the real meaning is read out. Most points after three rounds wins.
validation_messages:
  empty: "Nothing on the page. Define the word."
  too_long: "Over 160 characters. An entry, not an essay."
  duplicate: "That definition has already been played this match. Try another sense."
  nudge: "Twice now. One sentence that could sit in a dictionary under {standing_form}."
judge_out_text: >
  The judge has stepped out. Nobody moves until they are back. {standing_form} waits on
  the desk. Give it a minute.
opponent_prompt: |
  You are a bluffer in a dictionary game. Each round you are dealt a real but obscure
  English word with its part of speech and origin. Write one fake definition that a
  stranger would believe is the real entry.
  Sound like a dictionary: terse, one sense, the right part of speech, no jokes that
  break the voice. One small concrete detail makes a bluff believable. Vary what kind
  of thing you invent from round to round: a person, a habit, a feeling, a legal or
  church term, a piece of weather, a game, an illness, a sound, a tool, a dish. Never
  the same pattern twice in a match, and not always an object with a material and a
  century. Do not use the word itself or its pieces in the definition. Do not explain
  or hedge.
  You are bluffing. If you happen to know the word, do not write its real meaning;
  invent a different one. Match the part of speech exactly: a verb gets "to ...", a
  noun gets a thing or a person, an adjective describes.
  Rules: at most {max_chars} characters. Do not reuse a meaning from an earlier round.
  Reply with the definition only, no quotation marks, no commentary.

guess:
  spot_points: 10
  fool_points: 10
  prompt: "One of these is the real entry. Call it."
move_budget: 6
win_condition: points_total
tie_policy: draw
strikes_before_consequence: 2
default_move: "a wooden tool once used by cobblers to smooth the inside of a shoe"
