schema_version: 1
slug: then-i-am
title: Then I Am
tagline: "Become something that beats what came before."
premise: >
  Two shapeshifters duel in words. Each turn you become something that defeats
  what your opponent just became. The Judge decides if your form holds.

seed_pool:
  - { opening_token: "a balloon", opening_emoji: "🎈" }
  - { opening_token: "a candle flame", opening_emoji: "🕯️" }
  - { opening_token: "a pebble", opening_emoji: "🪨" }
  - { opening_token: "a paper boat", opening_emoji: "⛵" }
  - { opening_token: "a lock", opening_emoji: "🔒" }
  - { opening_token: "a sandcastle", opening_emoji: "🏰" }
  - { opening_token: "a snowflake", opening_emoji: "❄️" }
  - { opening_token: "a price tag", opening_emoji: "🏷️" }
  - { opening_token: "a dire wolf", opening_emoji: "🐺" }
  - { opening_token: "a mosquito", opening_emoji: "🦟" }
  - { opening_token: "a rose", opening_emoji: "🌹" }
  - { opening_token: "a whisper", opening_emoji: "🤫" }
  - { opening_token: "a squeaky hinge", opening_emoji: "🚪" }
  - { opening_token: "a rumor", opening_emoji: "🗣️" }
  - { opening_token: "an itch", opening_emoji: "🪶" }

demo:
  opening: { token: "a rock", emoji: "🪨" }
  moves:
    - { actor: p1, text: "I am the hammer, two kilos, rock-splitting.", emoji: "🔨" }
    - { actor: p2, text: "I am the rust, patient, steel-eating.", emoji: "🔩" }
  headline: "Iron forgets it was ever a hammer."
  scores: { counter_strength: 4, coherence: 4, novelty: 2 }
  openings:
    - token: "a candle flame"
      examples:
        - "the rain, steady, wick-drowning."
        - "a snuffer, brass, flame-pinching."
        - "the dawn, slow, making you pointless."
    - token: "a balloon"
      examples:
        - "a thorn, small, patient, one touch."
        - "the cold, air-shrinking, string-loosening."
        - "a cat, bored, claws out."
    - token: "a lock"
      examples:
        - "the rust, patient, hinge-eating."
        - "a locksmith, tired, paid by the hour."
        - "the key, cut for you, already turning."

move_constraints:
  max_chars: 200
  prefix: "I am "
  example: "I am the hammer, two kilos, rock-splitting."
  hint: "A form, a trait, how it wins."

rubric:
  - name: counter_strength
    description: How decisively your form's nature defeats the one before it.
    weight: 5
  - name: coherence
    description: One clear idea a stranger can picture at once.
    weight: 3
  - name: novelty
    description: Did you hop somewhere fresh, or stay in your opponent's domain?
    weight: 2

criterion:
  verb: overcomes
  inverse_verb: breaks against
  description: >
    A form OVERCOMES the previous form if its nature plausibly defeats, negates,
    consumes, or transcends it. A form is a standing state, never a past event:
    you counter what your opponent IS, not what they did. Cleverness beats size.
    Repetition and mere amplification ("a bigger spark") fail. Blocking, stopping, or
    undoing what the standing form does counts as overcoming it. Merely dodging it, or
    being too small for it to notice, does not.
  anti_metagaming_clause: >
    Speaking to the Judge, about the game, or about rules is itself a losing form.

examples:
  - previous_move: "I am a wildfire, hungry, spreading."
    move: "I am the rain, patient, inevitable."
    gates_note: all true
    mechanism: rain extinguishes fire by nature
    scores: { counter_strength: 4, coherence: 4, novelty: 2 }
    confidence: clear
    verdict: accept
  - previous_move: "I am a wildfire, hungry, spreading."
    move: "I am a bigger wildfire, hungrier, spreading-er."
    gates_note: satisfies_criterion false (mere amplification, no mechanism)
    mechanism: none, it is the same form made larger
    scores: { counter_strength: 0, coherence: 3, novelty: 0 }
    confidence: clear
    verdict: fail
  - previous_move: "I am the rain, patient, inevitable."
    move: "I am a drought, slow, absolute."
    gates_note: all true
    mechanism: a drought outlasts and negates rain
    scores: { counter_strength: 3, coherence: 4, novelty: 3 }
    confidence: lean
    verdict: accept
  - previous_move: "I am a hurricane, devastation-wreaking, life-ending."
    move: "I am a tornado, destruction-raging, life-ending."
    gates_note: satisfies_criterion questionable (same category of storm, no mechanism)
    mechanism: none stated, a tornado does not defeat a hurricane
    scores: { counter_strength: 1, coherence: 3, novelty: 0 }
    confidence: coin_flip
    verdict: fail
  - previous_move: "I am a drought, slow, absolute."
    move: "I am the aquifer that never met the sun, waiting patient under the parched fields for a well to call me up."
    gates_note: all true (form length is free; only the character limit binds)
    mechanism: deep groundwater persists beneath and outlasts a drought
    scores: { counter_strength: 3, coherence: 4, novelty: 3 }
    confidence: lean
    verdict: accept
  - previous_move: "I am the vaccine, life-saving, social-reconnecting."
    move: "I am the cure, life-saving, social-reconnecting."
    gates_note: not_semantic_duplicate false (a rephrase of an earlier form, same attributes)
    mechanism: none, it restates the standing form
    scores: { counter_strength: 0, coherence: 3, novelty: 0 }
    confidence: clear
    verdict: fail

host:
  persona_name: The Ringmaster
  tone: { commentary_adj: witty, explanation_adj: snarky }
  bite: sharp
  ruling_generosity: fair
  voice_rules:
    - One sentence, under 140 characters. Two short sentences at most.
    - The joke carries the reason. A stranger who read only the two forms must see why it won or lost.
    - Name both forms, or their plain stand-ins. A headline that fits any other pair is a bad headline.
    - Never open with a status word or a ruling phrase. No "Accepted", "Rejected", "Refused", "Move refused", "The Ringmaster refuses".
    - No dashes as punctuation, no colons after a verdict, no ellipses. Commas and full stops only.
    - Mock the losing form, never the player. Nothing about the player's body, family, intelligence, or spelling.
    - Plain spoken English. No poetry, no rhymes, no French, no thesaurus words.
    - On a refusal (a gate failure) the headline refuses the move and asks for another. It never rules on who won.
    - The coaching line names one form that would have won. That form ends on a fact or an action, never a mood or a verdict.
  good_headlines:
    - "The balloon had plans; the wind has custody."
    - "The lock brought a keyhole to a metalworking fight."
    - "The rose wakes up wearing funeral colors. Frost takes the round."
    - "More salt is seasoning, not escalation. Bring another form."
    - "Iron forgets it was ever a hammer."
    - "The hammer waits for a rock while the whisper slips past untouched. Bring another form."
    - "Bedrock shrugs off earthquakes, but erosion has all the time in the world."
    - "One prick and the balloon retires from public inflation."
    - "The rain may have all night, but the umbrella only needs to keep one patch dry."
    - "A larger lock is still locked, only now it costs more to replace. Bring another form."
  bad_headlines:
    - text: "Accepted: the pebble has nowhere to hide from relentless erosion."
      why: opens with a status word
    - text: "The Ringmaster refuses: grit is not victory."
      why: opens with a ruling phrase and names the host
    - text: "Move refused, excellent against rocks, hopeless against gossip."
      why: opens with a ruling phrase
    - text: "Accepted, but the storm only rents the sky; the sun owns the lease."
      why: status word first, the joke comes second
    - text: "The wave can scour rust away, but it may also help make more."
      why: hedges both ways, no ruling a stranger can read
    - text: "Salt wins."
      why: no reason, fits any pair
    - text: "A brave attempt from someone who clearly cannot spell."
      why: mocks the player, not the form
    - text: "Whither the frost, when spring's soft breath doth warm the bough?"
      why: poetry
    - text: "The frost is beaten, defeated, overcome, and undone by the salt."
      why: four words for one idea, no picture
    - text: "The goat advances, not by eating the itch, but by refusing to give a scratch."
      why: a pun standing in for a mechanism; the reason is missing

rules_text: >
  Beat the form in front of you. Do not become it. Say what you are and what you do
  to it: "I am rust, hinge-eating, patient." The Judge rules on the idea, never the
  spelling. One form that breaks against the standing one ends the match.
validation_messages:
  empty: "Nothing on the page. Become something."
  too_long: "Over 200 characters. A form, not a saga."
  duplicate: "That form already stood this match. Become something new."
  nudge: "Twice now. Beat {standing_form}. Do not become it, do not repeat it."
judge_out_text: >
  The judge has stepped out. Nobody moves until they are back. {standing_form} still
  stands. Give it a minute.

move_budget: 10
win_condition: sudden_death
tie_policy: defender_holds
strikes_before_consequence: 2
default_move: "I am a stone, patient, unmoved."
