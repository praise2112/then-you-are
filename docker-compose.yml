services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oddstage
      POSTGRES_PASSWORD: oddstage
      POSTGRES_DB: oddstage
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddstage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
